<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For_You tussenscherm</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        transform-origin: 0 0;
      }
      #titel {
        position: absolute;
        left: 88px;
        right: 330px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      #titelScene {
        margin-top: 0.35em;
        font-size: 0.56em;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: 0;
        color: #fff8d6;
      }
      #script {
        position: absolute;
        left: 0;
        width: 1080px;
        overflow: hidden;
      }
      #script iframe {
        position: absolute;
        left: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: #000;
      }
      /* Het script heeft een zwarte ondergrond; zo valt die weg en blijft alleen de tekst over de ster staan. */
      #script { mix-blend-mode: screen; }
      #stats {
        position: absolute;
        left: 88px;
        right: 88px;
      }
      #statsScene {
        color: rgba(255, 255, 255, 0.66);
        font-weight: 500;
        margin-bottom: 0.4em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #statsRij {
        display: flex;
        flex-wrap: nowrap;
        gap: 0 0.9em;
        align-items: baseline;
      }
      .telling {
        display: inline-flex;
        align-items: baseline;
        gap: 0.25em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .telling .emoji {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-weight: 400;
      }
      #chat {
        position: absolute;
        left: 88px;
        right: 88px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.45em;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
      }
      .regel {
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .regel.nieuw { animation: erin 260ms ease-out; }
      .naam { font-weight: 700; }
      .likes { color: #ff3b5c; font-weight: 700; white-space: nowrap; }
      #top {
        position: absolute;
        left: 88px;
        right: 88px;
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      #stem {
        position: absolute;
        left: 0;
        width: 1080px;
        box-sizing: border-box;
        padding: 44px 88px 52px;
        overflow: hidden;
        background: rgba(5, 8, 19, 0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }
      /* Eén scherm voor inloop en loading: het universum vult het beeld, de rest ligt eroverheen. */
      #universum {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: #050813;
        pointer-events: none;
      }
      /* Het genereren (titel en script) staat alleen in beeld als de camera in de gekozen ster zit. */
      #gen {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 900ms ease;
      }
      #gen.toon { opacity: 1; }
      #chatBak {
        position: absolute;
        left: 0;
        width: 1080px;
        bottom: 0;
        height: 760px;
        background: linear-gradient(to bottom, rgba(5, 8, 19, 0) 0%, rgba(5, 8, 19, 0.82) 38%, rgba(5, 8, 19, 0.94) 100%);
      }
      #qr {
        position: absolute;
        right: 56px;
        top: 56px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.94);
        border-radius: 14px;
        line-height: 0;
      }
      #qr[hidden] { display: none; }
      #qr img { width: 190px; height: 190px; }
      #stats { opacity: 0; transition: opacity 600ms ease; }
      #stats.toon { opacity: 1; }
      #stem[hidden] { display: none; }
      #stemTitel { font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
      #stemKop { font-size: 34px; font-weight: 500; color: rgba(255, 255, 255, 0.66); }
      .stemRij { position: relative; opacity: 0.6; transition: opacity 300ms ease; }
      .stemRij.koploper, .stemRij.winnaar { opacity: 1; }
      .stemRij.verloren { opacity: 0.22; }
      .stemTekst { display: flex; justify-content: space-between; gap: 24px; font-size: 38px; font-weight: 700; line-height: 1.12; }
      .stemTekst .n { font-variant-numeric: tabular-nums; }
      .stemBalk { height: 8px; margin-top: 10px; background: rgba(255, 255, 255, 0.14); }
      .stemBalk > span { display: block; height: 100%; width: 0; background: #fff; transition: width 400ms ease; }
      @keyframes erin {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <iframe id="universum" title="Universum" scrolling="no"></iframe>
      <div id="chatBak"></div>
      <div id="gen">
        <div id="titel"><div id="titelKop"></div><div id="titelScene"></div></div>
        <div id="script"><iframe id="scriptFrame" title="Script" scrolling="no"></iframe></div>
      </div>
      <div id="stem" hidden></div>
      <div id="qr" hidden></div>
      <div id="stats" hidden>
        <div id="statsScene"></div>
        <div id="statsRij"></div>
      </div>
      <div id="top" hidden></div>
      <div id="chat"></div>
    </div>
    <script src="/audience/vendor/qrcode-generator.min.js"></script>
    <script>
      const W = 1080, H = 1920, MAX_REGELS = 14;
      const el = (id) => document.getElementById(id);
      const stage = el("stage");
      let settings = {};
      let reacties = [];
      let ronde = { start: null, titel: null, emoji: {} };

      // Het script van de script-agent (poort 3027) op dezelfde machine.
      el("scriptFrame").src = `${location.protocol}//${location.hostname}:3027/script-agent/operator/stage`;

      // Het universum (padendienst, poort 3022) vult het scherm en speelt de reeks: stemmen of kiezen,
      // inzoomen, en na elke scène uitzoomen en nieuwe scènes laten vrijkomen. Het meldt waar het is.
      const NA_SCENE_MS = 6000; // zo lang staan de tellingen van de gespeelde scène in beeld
      el("universum").src = `${location.protocol}//${location.hostname}:3022/universe/stage.html?naScene=${NA_SCENE_MS}&waaromOnder=33&binnenTitel=0`;
      let universum = null, statsWeg = null, statsAan = false;
      // Vangnet: meldt het universum zich niet, dan staat het genereren gewoon in beeld.
      let universumStil = setTimeout(() => { universum = { stil: true }; zetLagen(); }, 12000);
      function zetLagen() {
        const inSter = !!(universum && (universum.stil || (universum.binnen && !universum.speelt)));
        el("gen").classList.toggle("toon", inSter && !stem && !statsAan);
        el("stats").classList.toggle("toon", statsAan);
      }
      window.addEventListener("message", (ev) => {
        const stand = ev.data;
        if (!stand || stand.bron !== "for_you-universum") return;
        clearTimeout(universumStil);
        const speelde = !!(universum && universum.speelt);
        universum = stand;
        if (el("titelScene").textContent !== (stand.titel || "")) { el("titelScene").textContent = stand.titel || ""; plaatsScript(); }
        // Scène afgelopen: eerst kort de tellingen, daarna zoomt het universum uit.
        if (speelde && !stand.speelt && stand.binnen) {
          statsAan = true;
          clearTimeout(statsWeg);
          statsWeg = setTimeout(() => { statsAan = false; zetLagen(); }, NA_SCENE_MS);
        }
        zetLagen();
      });

      // QR-code om mee te doen: altijd klein in de hoek.
      async function tekenQr() {
        const data = await fetch("/audience/admin/state?stage=qr&ts=" + Date.now(), { cache: "no-store" }).then((res) => res.json());
        const url = data.sessionJoin && data.sessionJoin.joinUrl;
        const box = el("qr");
        if (!url || typeof qrcode !== "function") { box.hidden = true; return; }
        if (box.dataset.url === url) return;
        const qr = qrcode(0, "M");
        qr.addData(url);
        qr.make();
        box.innerHTML = qr.createImgTag(8, 0);
        box.dataset.url = url;
        box.hidden = false;
      }
      tekenQr().catch(() => {});
      setInterval(() => tekenQr().catch(() => {}), 5000);

      function pas() {
        const s = Math.min(window.innerWidth / W, window.innerHeight / H);
        const tx = (window.innerWidth - W * s) / 2, ty = (window.innerHeight - H * s) / 2;
        stage.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      }
      window.addEventListener("resize", pas);
      pas();

      const getal = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);

      function toepassen(next) {
        settings = next || settings || {};
        const t = el("titel");
        el("titelKop").textContent = settings.tussenTitel ?? "Generating next scene";
        t.style.top = getal(settings.tussenTitelY, 110) + "px";
        t.style.fontSize = getal(settings.tussenTitelGrootte, 64) + "px";
        const sh = getal(settings.tussenScriptHoogte, 860);
        plaatsScript();
        el("stem").style.top = getal(settings.tussenScriptY, 230) + "px";
        el("stem").style.maxHeight = sh + "px"; // zo hoog als de lijst, zodat het universum eronder zichtbaar blijft
        el("stats").style.top = getal(settings.tussenStatsY, 1150) + "px";
        el("stats").style.fontSize = getal(settings.tussenStatsGrootte, 88) + "px";
        el("statsScene").style.fontSize = "0.36em";
        const c = el("chat");
        c.style.top = getal(settings.tussenChatY, 1380) + "px";
        c.style.height = getal(settings.tussenChatHoogte, 480) + "px";
        c.style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        el("top").style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        tekenChat();
      }

      // Het script begint onder de titel en de naam van de scène; de onderkant (nieuwste tekst) blijft in beeld.
      function plaatsScript() {
        const y = getal(settings.tussenScriptY, 230), sh = getal(settings.tussenScriptHoogte, 860);
        const t = el("titel");
        const top = Math.max(y, t.offsetTop + t.offsetHeight + 28);
        const hoogte = Math.max(120, sh - (top - y));
        el("script").style.top = top + "px";
        el("script").style.height = hoogte + "px";
        el("scriptFrame").style.top = (hoogte - H) + "px";
      }

      function tekenStats() {
        const box = el("stats");
        if (!ronde || !ronde.start) { box.hidden = true; plaatsChat(); return; }
        box.hidden = false;
        el("statsScene").textContent = ronde.titel || "";
        const rij = el("statsRij");
        rij.textContent = "";
        const emoji = ronde.emoji || {};
        const lijst = reacties.length ? reacties.map((r) => r.emoji) : Object.keys(emoji);
        for (const e of lijst) {
          const span = document.createElement("span");
          span.className = "telling";
          const em = document.createElement("span");
          em.className = "emoji";
          em.textContent = e;
          const n = document.createElement("span");
          n.textContent = String(Number(emoji[e] || 0));
          span.append(em, n);
          rij.appendChild(span);
        }
        plaatsChat();
      }

      // Reacties van deze ronde; de comment met de meeste likes staat bovenaan (boven de reacties).
      let berichten = [];
      // Elke regel wordt één keer gemaakt en daarna hergebruikt; alleen nieuwe regels schuiven in beeld.
      // (Alles opnieuw opbouwen liet de hele chat bij elk bericht of elke emoji knipperen.)
      const regelEls = new WeakMap();
      function vulRegel(r, msg) {
        r.textContent = "";
        const naam = document.createElement("span");
        naam.className = "naam";
        naam.textContent = (msg.name || "Anoniem") + " ";
        if (/^#[0-9a-f]{6}$/i.test(String(msg.nameColor || ""))) naam.style.color = msg.nameColor;
        r.append(naam, document.createTextNode(msg.text));
        if (msg.likes > 0) {
          const h = document.createElement("span");
          h.className = "likes";
          h.textContent = " \u2665 " + msg.likes;
          r.appendChild(h);
        }
        r.dataset.likes = String(msg.likes || 0);
      }
      function regelEl(msg) {
        let r = regelEls.get(msg);
        if (!r) {
          r = document.createElement("div");
          r.className = "regel nieuw";
          r.addEventListener("animationend", () => r.classList.remove("nieuw"), { once: true });
          vulRegel(r, msg);
          regelEls.set(msg, r);
        } else if (r.dataset.likes !== String(msg.likes || 0)) {
          vulRegel(r, msg);
        }
        return r;
      }
      // Zet de juiste elementen op hun plek zonder bestaande regels weg te halen.
      function zetKinderen(ouder, lijst) {
        for (const kind of [...ouder.children]) if (!lijst.includes(kind)) kind.remove();
        lijst.forEach((kind, i) => {
          if (ouder.children[i] !== kind) ouder.insertBefore(kind, ouder.children[i] || null);
        });
      }
      function tekenChat() {
        const top = berichten.reduce((best, m) => (m.likes > 0 && (!best || m.likes > best.likes || (m.likes === best.likes && m.id < best.id)) ? m : best), null);
        const t = el("top");
        t.hidden = !top;
        zetKinderen(t, top ? [regelEl(top)] : []);
        const c = el("chat");
        zetKinderen(c, berichten.slice(-MAX_REGELS).filter((m) => m !== top).map(regelEl));
        plaatsChat();
      }
      function plaatsChat() {
        // De chat begint nooit boven de onderkant van de tellingen.
        const stats = el("stats");
        const statsOnder = stats.hidden ? 0 : stats.offsetTop + stats.offsetHeight + 32;
        const chatY = getal(settings.tussenChatY, 1380);
        const chatTop = Math.max(chatY, statsOnder);
        const chatHoogte = Math.max(0, getal(settings.tussenChatHoogte, 480) - (chatTop - chatY));
        const t = el("top");
        t.style.top = chatTop + "px";
        const topHoogte = t.hidden ? 0 : t.offsetHeight + 24;
        const c = el("chat");
        c.style.top = (chatTop + topHoogte) + "px";
        c.style.height = Math.max(0, chatHoogte - topHoogte) + "px";
      }
      function regel(msg) {
        if (!msg || msg.system || !msg.text) return;
        if (ronde && ronde.start && msg.time && Date.parse(msg.time) < Date.parse(ronde.start)) return;
        if (msg.id && berichten.some((m) => m.id === msg.id)) return;
        berichten.push({ id: Number(msg.id) || 0, name: msg.name, nameColor: msg.nameColor, text: msg.text, likes: Number(msg.likes) || 0, time: msg.time });
        if (berichten.length > 200) berichten = berichten.slice(-200);
        tekenChat();
      }

      function nieuweRonde(next) {
        const was = ronde && ronde.start;
        ronde = next || ronde;
        if (ronde.start && ronde.start !== was) { berichten = []; tekenChat(); }
        tekenStats();
      }

      // Stemmen op de startscène: de stand staat op de plek van het script. Na de uitslag blijft
      // de winnaar even staan, daarna komt het script terug.
      let stem = null, stemTimer = null, stemWeg = null;
      function tekenStem() {
        const box = el("stem");
        if (!stem) { box.hidden = true; return; }
        box.hidden = false;
        const counts = stem.counts || [];
        const hoogste = Math.max(0, ...counts);
        const totaal = counts.reduce((a, b) => a + b, 0);
        const over = stem.endsAt ? Math.max(0, Math.ceil((Date.parse(stem.endsAt) - Date.now()) / 1000)) : 0;
        box.textContent = "";
        const titel = document.createElement("div");
        titel.id = "stemTitel";
        titel.textContent = stem.uitslag ? "De eerste scène" : "Kies de eerste scène";
        box.appendChild(titel);
        const kop = document.createElement("div");
        kop.id = "stemKop";
        kop.textContent = stem.uitslag
          ? (stem.uitslag.geloot === "te_weinig_stemmen" ? "Geen stemmen: het lot besliste" : stem.uitslag.geloot === "gelijke_stand" ? "Gelijke stand: het lot besliste" : totaal + " stemmen")
          : "Stem op je telefoon \u00b7 nog " + over + " s \u00b7 " + totaal + " stemmen";
        box.appendChild(kop);
        (stem.options || []).forEach((optie, i) => {
          const n = Number(counts[i] || 0);
          const rij = document.createElement("div");
          rij.className = "stemRij" + (stem.uitslag ? (stem.uitslag.index === i ? " winnaar" : " verloren") : (n > 0 && n === hoogste ? " koploper" : ""));
          const tekst = document.createElement("div");
          tekst.className = "stemTekst";
          const t = document.createElement("span");
          t.textContent = optie;
          const c = document.createElement("span");
          c.className = "n";
          c.textContent = String(n);
          tekst.append(t, c);
          const balk = document.createElement("div");
          balk.className = "stemBalk";
          const vul = document.createElement("span");
          vul.style.width = (hoogste ? Math.round((n / hoogste) * 100) : 0) + "%";
          balk.appendChild(vul);
          rij.append(tekst, balk);
          box.appendChild(rij);
        });
      }
      function zetStem(poll) {
        clearInterval(stemTimer);
        clearTimeout(stemWeg);
        stem = poll ? { id: poll.id, options: poll.options, counts: poll.counts || [], endsAt: poll.endsAt, uitslag: null } : null;
        if (stem) stemTimer = setInterval(tekenStem, 1000);
        tekenStem();
        zetLagen();
      }

      const bron = new EventSource("/audience/stage/stroom");
      bron.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "stage_herlaad") { location.reload(); return; }
        if (msg.type === "begin") {
          toepassen(msg.settings);
          reacties = msg.reacties || [];
          ronde = msg.ronde || ronde;
          berichten = [];
          for (const m of msg.berichten || []) regel(m);
          zetStem(msg.startStemming || null);
          tekenChat();
          tekenStats();
        } else if (msg.type === "stage_settings") toepassen(msg.stage && msg.stage.settings);
        else if (msg.type === "start_stemming") zetStem(msg.poll);
        else if (msg.type === "poll_update" && stem && Number(msg.pollId) === Number(stem.id)) { stem.counts = msg.counts || stem.counts; tekenStem(); }
        else if (msg.type === "start_stemming_uitslag" && stem && Number(msg.pollId) === Number(stem.id)) {
          clearInterval(stemTimer);
          stem.counts = msg.uitslag.counts || stem.counts;
          stem.uitslag = msg.uitslag;
          tekenStem();
          stemWeg = setTimeout(() => zetStem(null), 12000);
        }
        else if (msg.type === "reacties") { reacties = msg.reacties || []; tekenStats(); }
        else if (msg.type === "fase") nieuweRonde(msg.ronde);
        else if (msg.type === "reaction_update" && msg.ronde) { ronde.emoji = msg.ronde; tekenStats(); }
        else if (msg.type === "comment") regel(msg);
        else if (msg.type === "comment_likes") {
          const m = berichten.find((b) => b.id === Number(msg.id));
          if (m) { m.likes = Number(msg.likes) || 0; tekenChat(); }
        }
        else if (msg.type === "session_reset" || msg.type === "session_closed" || msg.type === "chat_reset") {
          berichten = [];
          tekenChat();
          ronde.emoji = {};
          tekenStats();
        }
      };
    </script>
  </body>
</html>
