<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For_You tussenscherm</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      /* Eén vormtaal: wit op nacht, één letter, dunne witte lijn, één beweging. Kleur zit alleen in
         het beeld van de omgeving, in emoji en (gedempt) in de namen van de chat. Niets vervaagt. */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        transform-origin: 0 0;
        --wit-2: rgba(255, 255, 255, 0.66);
        --wit-3: rgba(255, 255, 255, 0.30);
        --nacht: #07080b;
        --curve: cubic-bezier(.65, 0, .35, 1);
      }
      /* Eén pagina voor het hele hoofdscherm. Krijgt de pagina de fase van TouchDesigner
         (window.forYouFase), dan is ze buiten de scène dekkend en tijdens de scène doorzichtig, met
         alleen de emoji en de ondertitel over het camerabeeld. Zonder dat signaal blijft ze het
         scherm van inloop en loading. */
      html.een, html.een body, html.een #stage { background: transparent; }
      /* Het hele scherm is één vel: bij de scène schuift het omhoog weg, daarna komt het dezelfde weg terug. */
      #tussenlaag {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--nacht);
        transition: transform 520ms var(--curve);
      }
      body.scene #tussenlaag { transform: translateY(-100%); }
      #ondertitel, #emoji {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: transparent;
        pointer-events: none;
        visibility: hidden;
      }
      body.een #emoji { visibility: visible; }
      /* Tijdens de scène: de chat linksonder over het camerabeeld. Een bericht blijft even staan en gaat dan weg. */
      #sceneChat { position: absolute; left: 60px; bottom: 70px; width: 600px; display: grid; gap: 10px; font-size: 32px; line-height: 1.2; color: #fff; text-shadow: 0 0 4px #000, 0 2px 10px rgba(0, 0, 0, 0.9); overflow-wrap: anywhere; pointer-events: none; visibility: hidden; }
      body.scene #sceneChat { visibility: visible; }
      #sceneChat b { font-weight: 700; margin-right: 0.35em; }
      body.scene #ondertitel { visibility: visible; }
      /* Het universum vult het beeld; de kaart zelf staat in de strook tussen de tekst boven en de chat onder. */
      #universum {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: var(--nacht);
        pointer-events: none;
      }

      /* ── Vlakken ──────────────────────────────────────────────────────────────────────────────
         Elk vlak heeft één vaste plek. Het schuift het beeld in en uit vanaf de dichtstbijzijnde rand:
         eerst het oude eruit, dan het nieuwe erin. Wat er in een vlak staat verandert alleen als het
         uit beeld is. */
      .p {
        position: absolute;
        box-sizing: border-box;
        z-index: 4;
        transition: transform 440ms var(--curve), visibility 0s;
      }
      .p.uit {
        transform: translate(var(--wx, 0px), var(--wy, 0px));
        visibility: hidden;
        transition: transform 300ms var(--curve), visibility 0s linear 300ms;
      }
      #stage.direct .p, #stage.direct #tussenlaag { transition: none; }
      .kop { font-weight: 700; line-height: 1.04; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
      .klein { color: var(--wit-2); }
      .qr { flex: none; box-sizing: border-box; background: #fff; padding: 9px; line-height: 0; }
      .qr img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      .beeld { flex: none; position: relative; overflow: hidden; background: var(--nacht); }
      .beeld[hidden] { display: none; }
      .beeld img, .beeld video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      /* De achtergrond van een omgeving is drie schermen breed; "midden" toont alleen het middelste deel. */
      .beeld[data-uitsnede="midden"] img, .beeld[data-uitsnede="midden"] video {
        left: -100%;
        top: 50%;
        width: 300%;
        height: auto;
        object-fit: fill;
        transform: translateY(-50%);
      }
      /* "links" toont alleen het linkerdeel (Cam 1). */
      .beeld[data-uitsnede="links"] img, .beeld[data-uitsnede="links"] video {
        left: 0;
        top: 50%;
        width: 300%;
        height: auto;
        object-fit: fill;
        transform: translateY(-50%);
      }

      /* Live beeld van de publiekscamera bij inloop en stemmen, zwart-wit; plek en breedte in Admin.
         De onderste 8 % van het beeld (met het UniFi-logo) valt weg. */
      #p-camera { left: 640px; top: 1720px; width: 380px; --wx: 1200px; }
      #p-camera .venster { position: relative; width: 100%; aspect-ratio: 960 / 248; overflow: hidden; background: var(--nacht); }
      #p-camera img { position: absolute; left: 0; top: 0; display: block; width: 100%; height: auto; filter: grayscale(1) contrast(1.1); }
      #p-camera .klein { font-size: 20px; margin-top: 8px; }

      /* Inloop: meedoen, groot bovenaan. */
      /* "Doe mee", een pijl, en de QR-code waar de pijl naar wijst: zo is te zien hoe je meedoet. */
      #p-meedoen { left: 60px; top: 60px; width: 960px; --wy: -400px; display: flex; align-items: center; gap: 32px; }
      #p-meedoen .pijl { flex: 1 1 auto; min-width: 60px; height: 0; border-top: 5px solid #fff; position: relative; }
      #p-meedoen .pijl::after { content: ""; position: absolute; right: 2px; top: -17px; width: 24px; height: 24px; border-top: 5px solid #fff; border-right: 5px solid #fff; transform: rotate(45deg); }
      #p-meedoen .kop { font-size: 108px; line-height: 0.9; letter-spacing: -0.045em; margin-left: -0.04em; }
      #p-meedoen .klein { font-size: 26px; margin-top: 16px; }
      #p-meedoen .qr { width: 280px; height: 280px; padding: 14px; }
      #p-meedoen .tekst { flex: none; }

      /* Stemmen: links de lijst met balken, rechts de QR-code met de tijd die er nog is. */
      #p-stemmen { left: 60px; top: 60px; width: 720px; --wy: -640px; display: grid; }
      /* Boven de lijst: de hoeveelste startscène dit is, met de teller groot. */
      #stemKop { display: flex; align-items: baseline; gap: 22px; margin-bottom: 22px; }
      #stemKop:empty { display: none; }
      #stemKop b { font-weight: 700; font-size: 108px; line-height: 0.9; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
      #stemKop span { font-weight: 700; font-size: 40px; letter-spacing: -0.025em; }
      #stemLijst { display: grid; }
      .stemrij { display: grid; grid-template-columns: minmax(0, 1fr) 150px 46px; align-items: center; gap: 17px; height: 42px; font-size: 26px; color: var(--wit-2); }
      .stemrij span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .stemrij b { text-align: right; font-size: 25px; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
      .stemrij .spoor { height: 10px; position: relative; }
      .stemrij .spoor i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--wit-3); transition: width 260ms var(--curve); }
      .stemrij.eerst { color: #fff; }
      .stemrij.eerst .spoor i { background: #fff; }
      .stemrij.af { color: var(--wit-3); }
      #p-stemqr { left: 820px; top: 60px; width: 200px; --wy: -360px; }
      #p-stemqr .qr { width: 200px; height: 200px; }
      #stemKlok { font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; margin-top: 14px; transform-origin: left center; }
      /* De laatste tien seconden: alleen het getal, groter, met een tik per seconde. */
      #stemKlok.laatste { font-size: 120px; }
      #stemKlok.tik { animation: stemTik 380ms var(--curve); }
      @keyframes stemTik { from { transform: scale(1.18); } to { transform: scale(1); } }
      #p-stemqr .klein { font-size: 15px; margin-top: 6px; white-space: nowrap; }

      /* De titel van de scène die komt: altijd op dezelfde plek, met het beeld van de omgeving. */
      #p-titel { left: 60px; top: 60px; width: 960px; --wy: -420px; display: flex; justify-content: space-between; align-items: flex-start; gap: 36px; }
      #p-titel .links { min-width: 0; display: grid; gap: 10px; }
      #titelTekst { font-size: 72px; }
      #titelTekst.lang { font-size: 62px; }
      #titelTekst.langer { font-size: 52px; }
      #titelScore { font-weight: 700; font-size: 50px; line-height: 1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; color: var(--wit-2); }
      #titelScore:empty { display: none; }
      #titelBeeld { width: 151px; height: 151px; }

      /* De tekst die gemaakt wordt: een klein venster met de pagina van de script-agent zelf (de
         terminal, zoals die altijd was) en eronder een laadbalk. */
      /* Het venster komt van links: zo schuift het niet over de titel heen. */
      #p-tekst { left: 60px; top: 248px; width: 640px; height: 222px; --wx: -720px; border: 2px solid #fff; background: rgba(7, 8, 11, 0.93); display: flex; flex-direction: column; }
      #p-tekst .balk { flex: none; height: 24px; border-bottom: 2px solid #fff; }
      #script { flex: none; position: relative; height: 146px; overflow: hidden; }
      #scriptFrame { position: absolute; left: 0; top: 0; border: 0; background: transparent; transform-origin: 0 0; pointer-events: none; }
      .laadrij { flex: none; height: 34px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 0 16px; font-size: 22px; color: var(--wit-2); font-variant-numeric: tabular-nums; }
      .laad { height: 8px; position: relative; }
      .laad::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 2px; background: var(--wit-3); }
      .laad i { position: absolute; left: 0; top: 0; height: 8px; width: 0; background: #fff; }

      /* Chat: linksonder, namen in gedempte kleur. Wat niet past valt er in hele regels af. */
      #p-chat { left: 60px; width: 560px; --wy: 720px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
      #chatRegels { flex: none; display: grid; gap: 8px; }
      .chatregel { line-height: 1.2; color: rgba(255, 255, 255, 0.5); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
      .chatregel b { font-weight: 700; margin-right: 0.35em; color: var(--wit-2); }
      .chatregel .likes { white-space: nowrap; color: rgba(255, 255, 255, 0.34); }
      .chatregel.vast { color: var(--wit-2); }

      /* De ranking: wie het meest in de chat zet. Rechts naast het venster met de tekst. */
      #p-ranking { left: 730px; top: 248px; width: 290px; --wx: 400px; display: grid; gap: 6px; }
      #p-ranking .klein { font-size: 22px; margin-bottom: 4px; }
      .rankrij { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: baseline; gap: 8px; font-size: 26px; line-height: 1.25; color: var(--wit-2); }
      .rankrij span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rankrij b { font-variant-numeric: tabular-nums; }
      .rankrij.eerst { color: #fff; font-size: 34px; font-weight: 700; }
      /* De spelers die zich klaarmaken: drie kleine vensters in zwart-wit, rechtsonder. Tijdens het
         stemmen staan ze groter in het midden onderin (p-stemspelers). */
      #p-spelers { left: 640px; top: 1634px; width: 380px; --wy: 320px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      /* Staat het beeld van de publiekscamera er ook (inloop, stemmen op de startscène), dan staan de spelers erboven. */
      #stage.metcamera #p-spelers { top: 1487px; }
      #p-stemspelers { left: 265px; top: 1400px; width: 550px; --wy: 560px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .spelerrij .speler { position: relative; aspect-ratio: 9 / 16; overflow: hidden; border: 2px solid var(--wit-3); background: repeating-linear-gradient(135deg, #15171c 0 10px, #0d0e12 10px 20px); }
      .spelerrij img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.1); }
      .spelerrij .speler.leeg img { visibility: hidden; }
      /* Doorlopende stroom: één strook met de drie spelers naast elkaar; elk venster toont zijn derde. */
      .spelerrij.stroom .speler img { width: 300%; max-width: none; object-fit: fill; }
      .spelerrij.stroom .speler:nth-child(2) img { left: -100%; }
      .spelerrij.stroom .speler:nth-child(3) img { left: -200%; }
      /* Komt er van geen enkele speler beeld, dan blijven de vensters weg. */
      .spelerrij.geen { visibility: hidden; }

      /* Stemmen na de scène. Bovenaan de oproep; eerst groot 3, 2, 1 in het midden, dan schuift het
         getal omhoog naar de klok en wordt de cirkel rondgetrokken. Eronder een balk van wie gestemd
         heeft. Het universum is zolang weg. */
      #universum { transition: opacity 400ms var(--curve); }
      html.snel #universum { transition-duration: 200ms; }
      html.snel .p { transition-duration: 260ms, 0s; }
      html.snel .p.uit { transition-duration: 180ms, 0s; transition-delay: 0s, 180ms; }
      html.snel #tussenlaag { transition-duration: 340ms; }
      #stage.stemfase #universum { opacity: 0; }
      #p-stem { left: 0; top: 0; width: 1080px; height: 1000px; --wy: -1040px; }
      #p-stem .oproep { position: absolute; left: 60px; top: 60px; width: 700px; font-weight: 700; font-size: 108px; line-height: 0.9; letter-spacing: -0.045em; margin-left: -0.04em; text-wrap: balance; }
      #p-stem .qr { position: absolute; left: 800px; top: 60px; width: 220px; height: 220px; padding: 11px; }
      #stemCirkel { position: absolute; left: 290px; top: 340px; width: 500px; height: 500px; overflow: visible; }
      #stemCirkel circle { fill: none; }
      #stemCirkel .spoor { stroke: var(--wit-3); stroke-width: 2; transition: opacity 300ms; }
      #stemCirkel .loop { stroke: #fff; stroke-width: 10; transform: rotate(-90deg); transform-origin: 250px 250px; }
      #stemGetal { position: absolute; left: 540px; top: 590px; font-weight: 700; font-size: 540px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; white-space: nowrap;
        transform: translate(-50%, -50%) scale(0.37); transition: transform 800ms var(--curve); }
      #stemGetal span { display: inline-block; }
      #stemGetal span.tik { animation: stemGetalTik 260ms var(--curve); }
      @keyframes stemGetalTik { from { transform: scale(1.18); } to { transform: scale(1); } }
      #p-stem.groot #stemGetal { transform: translate(-50%, calc(-50% + 470px)) scale(1); transition: none; }
      #stemBalk { position: absolute; left: 60px; top: 884px; width: 960px; height: 12px; transition: opacity 300ms; }
      #stemBalk::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: var(--wit-3); }
      #stemBalk i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: #fff; transition: width 300ms var(--curve); }
      #stemTal { position: absolute; left: 60px; right: 60px; top: 920px; text-align: center; font-size: 26px; color: var(--wit-2); font-variant-numeric: tabular-nums; transition: opacity 300ms; }
      #p-stem:not(.klok) .spoor, #p-stem:not(.klok) #stemBalk, #p-stem:not(.klok) #stemTal { opacity: 0; }
      /* Onder de klok: de volgende scène wordt geschreven, in het venster van de operator-chat. Het
         venster is doorzichtig en ligt deels over de spelers. */
      #p-schrijf { left: 110px; top: 1018px; width: 860px; --wx: -1000px; z-index: 5; }
      #p-schrijf .label { height: 100px; font-weight: 700; font-size: 62px; line-height: 1; letter-spacing: -0.03em; }
      #p-schrijf .venster { height: 340px; border: 2px solid #fff; box-sizing: border-box; display: flex; flex-direction: column; }
      #p-schrijf .balk { flex: none; height: 24px; border-bottom: 2px solid #fff; }
      #script2 { flex: 1; position: relative; overflow: hidden; }
      #scriptFrame2 { position: absolute; left: 0; top: 0; border: 0; background: transparent; transform-origin: 0 0; pointer-events: none; }
      #p-schrijf .laadrij { height: 46px; }

      /* Na het begin staat alleen het adres nog klein onderin. */
      #p-voet { left: 0; top: 1867px; width: 1080px; height: 53px; --wy: 80px; padding: 0 60px; display: flex; align-items: center; font-size: 22px; color: var(--wit-2); }

      /* Rapport na een scène: het vult het hele scherm, van boven af, in drie bladen. */
      #p-rapport { left: 0; top: 0; width: 1080px; height: 1920px; --wy: 1940px; z-index: 6; background: var(--nacht); padding: 150px 60px 110px; }
      #p-rapport .inhoud { position: relative; width: 100%; height: 100%; }
      .rp { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 44px; }
      .rp.weg { display: none; }
      .rp-links { min-width: 0; display: grid; gap: 14px; align-content: start; }
      .kopregel { display: flex; justify-content: space-between; align-items: flex-start; gap: 36px; min-width: 0; }
      .kopregel > div:first-child { min-width: 0; display: grid; gap: 12px; }
      #p-rapport .kop { font-size: 100px; }
      #p-rapport .kop.lang { font-size: 80px; }
      #p-rapport .kop.langer { font-size: 64px; }
      #p-rapport .klein { font-size: 36px; }
      #rpBeeld { width: 210px; height: 210px; }
      .groot { font-weight: 700; font-size: 400px; line-height: 0.86; min-height: 0.86em; letter-spacing: -0.045em; margin-left: -0.05em; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .rp-rijen { display: grid; min-width: 0; }
      .rij { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 32px; padding: 13px 0; border-top: 2px solid var(--wit-3); visibility: hidden; }
      .rij.aan { visibility: visible; }
      .rij.streep { border-top-color: #fff; }
      .rij span { font-size: 36px; color: var(--wit-2); min-width: 0; }
      .rij b { font-size: 76px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; font-variant-numeric: tabular-nums; }
      .rij.som span { color: #fff; }
      .rij.som b { font-size: 61px; }
      .rij .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 44px; color: #fff; margin-right: 0.35em; }
      .meter { grid-column: 1 / -1; height: 6px; margin-top: 10px; position: relative; }
      .meter::before { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 2px; background: var(--wit-3); }
      .meter i { position: absolute; left: 0; top: 0; height: 6px; width: 0; background: #fff; transition: width 450ms var(--curve); }
      .golf { grid-column: 1 / -1; width: 100%; height: 100px; margin-top: 12px; display: block; }
      .golf rect { fill: #fff; }
      .staaf { display: grid; grid-template-columns: 40% 1fr 170px; align-items: center; gap: 24px; padding: 11px 0; font-size: 36px; line-height: 1.1; color: var(--wit-2); visibility: hidden; }
      .staaf.aan { visibility: visible; }
      .staaf span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .staaf b { text-align: right; font-size: 61px; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
      .staaf .spoor { height: 16px; position: relative; }
      .staaf .spoor::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--wit-3); }
      .staaf .spoor i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--wit-3); transition: width 450ms var(--curve); }
      .staaf.nu { color: #fff; }
      .staaf.nu .spoor i { background: #fff; }
      .staaf.leeg { color: var(--wit-3); }
      /* Uitsneden van lachende gezichten uit de publiekscamera. */
      #rpCamUitleg { color: #fff; line-height: 1.25; }
      #rpCamUitleg:empty, #rpCamKop:empty { display: none; }
      .niet-bewaard { color: var(--wit-2); visibility: hidden; }
      .niet-bewaard.aan { visibility: visible; }
      .lachjes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px 12px; padding: 22px 0 30px; }
      .lachjes .gezicht { margin: 0; visibility: hidden; }
      .lachjes .gezicht.aan { visibility: visible; }
      .lachjes img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; filter: grayscale(1) contrast(1.15); }
      .lachjes figcaption { font-size: 26px; font-weight: 700; padding-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" class="direct">
     <div id="tussenlaag">
      <iframe id="universum" title="Universum" scrolling="no"></iframe>

      <div class="p uit" id="p-meedoen">
        <div class="tekst"><div class="kop">Doe mee</div><div class="klein">Scan de code</div><div class="klein" data-adres></div></div>
        <div class="pijl" aria-hidden="true"></div>
        <div class="qr" data-qr></div>
      </div>
      <div class="p uit" id="p-stemmen"><div id="stemKop"></div><div id="stemLijst"></div></div>
      <div class="p uit" id="p-stemqr">
        <div class="qr" data-qr></div>
        <div id="stemKlok"></div>
        <div class="klein">om te stemmen</div>
        <div class="klein" data-adres></div>
      </div>
      <div class="p uit" id="p-titel">
        <div class="links"><div class="kop" id="titelTekst"></div><div id="titelScore"></div></div>
        <div class="beeld" id="titelBeeld" hidden></div>
      </div>
      <div class="p uit" id="p-tekst">
        <div class="balk"></div>
        <div id="script"><iframe id="scriptFrame" title="Script" scrolling="no"></iframe></div>
        <div class="laadrij"><div class="laad"><i id="laadVul"></i></div><span id="laadGetal">0%</span></div>
      </div>

    <script>
      const W = 1080, H = 1920, MAX_REGELS = 14;

      const getal = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);

      let settings = {};

      // ── Indeling ──────────────────────────────────────────────────────────────────────────────

      // universum, en linksonder de chat. De chat is in Admin hoger of lager te zetten; het universum

      const TEKST_ONDER = 470; // onderkant van het venster met de tekst

      const zichtNu = () => [TEKST_ONDER + 30, Math.max(TEKST_ONDER + 330, chatPlek().y - 30)];

      // Na een scène wacht het met uitzoomen tot het rapport is getoond en dit scherm het vrijgeeft.
      // NA_SCENE_MAX is het vangnet: komt de vrijgave niet, dan gaat het universum na die tijd vanzelf verder.
      const NA_SCENE_MAX = new URLSearchParams(location.search).get("rapport") === "1" ? 30000 : 60000;
      // ?tempo= : de reeks van het universum en de overgangen van de vlakken sneller (proef).
      // De reeks van het universum loopt vlot (?tempo=1&vlot=0 geeft de rustige reeks van vroeger).
      const TEMPO = Number(new URLSearchParams(location.search).get("tempo")) || 3.5;
      const VLOT = new URLSearchParams(location.search).get("vlot") !== "0";
      const SNEL = TEMPO > 1;
      if (SNEL) document.documentElement.classList.add("snel");
      // Het rapport: bij scène RAPPORT_SNELST_BIJ duurt het nog dit deel van de eerste keer, sneller wordt het niet.
      const RAPPORT_SNELST = 0.2, RAPPORT_SNELST_BIJ = 10;
      // De poorten van het universum en de script-agent zijn alleen op een proefopstelling anders
      // (?universumPoort=…&scriptPoort=…).
      const UNIVERSUM_POORT = Number(new URLSearchParams(location.search).get("universumPoort")) || 3022;
      const SCRIPT_POORT = Number(new URLSearchParams(location.search).get("scriptPoort")) || 3027;
      // Op de website (de proefshow) staat alles achter één adres: ?eenAdres=1. In de zaal heeft elk
      // onderdeel zijn eigen poort. ?stand= geeft het universum een ander adres voor zijn stand.
      const EEN_ADRES = new URLSearchParams(location.search).get("eenAdres") === "1";
      const STAND = new URLSearchParams(location.search).get("stand") || "";
      // Na de scène wordt er gestemd en gaat het universum daarna meteen verder. Met ?rapport=1 komt
      // het rapport van vroeger terug.
      const RAPPORT = new URLSearchParams(location.search).get("rapport") === "1";
      // ?universum= : het pad van het universum op dit adres (de proefshow heeft een eigen universum).
      const universumParam = new URLSearchParams(location.search).get("universum") || "";
      const UNIVERSUM_PAD = /^\/[\w\-/]+$/.test(universumParam) ? universumParam : "/universe";
      const opPoort = (poort) => (EEN_ADRES ? location.origin : `${location.protocol}//${location.hostname}:${poort}`);
      const wsOpPoort = (poort) => `${location.protocol === "https:" ? "wss" : "ws"}://${EEN_ADRES ? location.host : `${location.hostname}:${poort}`}`;
      el("universum").src = `${opPoort(UNIVERSUM_POORT)}${UNIVERSUM_PAD}/stage.html?naScene=${NA_SCENE_MAX}&vrijgave=1&padZoom=1&tempo=${Number(new URLSearchParams(location.search).get("tempo")) || 3.5}${new URLSearchParams(location.search).get("meet") ? "&meet=1" : ""}${new URLSearchParams(location.search).get("vlot") !== "0" ? "&vlot=1" : ""}&binnenTitel=0&gekozenTitel=0&stemTekst=0&zicht=${zichtNu().join(",")}${STAND ? `&stand=${encodeURIComponent(STAND)}` : ""}`;
      function naarUniversum(bericht) {
        try { el("universum").contentWindow.postMessage({ bron: "for_you-scherm", ...bericht }, "*"); } catch (_err) {}
      }
      const universumVerder = () => naarUniversum({ verder: true });
      const meldZicht = () => naarUniversum({ zicht: zichtNu() });
      el("universum").addEventListener("load", meldZicht);

      // ── Geluid ────────────────────────────────────────────────────────────────────────────────
      // Als een analoog toestel: tikken van ruis door filters met een doffe klap eronder, en tonen uit
      // twee licht verstemde oscillatoren. Alles gaat door een zachte oversturing en een demper, zodat
      // het warm en niet digitaal klinkt. Een browser laat geluid pas toe na een klik of
      // toets; lukt het starten niet, dan blijft het scherm stil en werkt de rest gewoon.
      // Het volume is in Admin te regelen (Geluid zaalscherm, in procenten).
      let audio = null, ruis = null, meester = null;
      // De tikken en klappen zijn kort en vallen weg naast de bel; ze gaan daarom dit aantal keer harder.
      // Een begrenzer achter het hoofdvolume houdt het geheel onder de rand.
      const TIK_HARDER = 3;
      const geluidVolume = () => Math.min(100, Math.max(0, getal(settings.tussenGeluid, 50))) / 100;
      function geluidAan() {
        if (audio) { if (audio.state === "suspended") audio.resume().catch(() => {}); return; }
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        try {
          audio = new Ctx();
          ruis = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
          const data = ruis.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          meester = audio.createGain();
          meester.gain.value = geluidVolume();
          const begrenzer = audio.createDynamicsCompressor();
          begrenzer.threshold.value = -4;
          begrenzer.knee.value = 0;
          begrenzer.ratio.value = 20;
          begrenzer.attack.value = 0.001;
          begrenzer.release.value = 0.08;
          const warm = audio.createWaveShaper();
          const kromme = new Float32Array(1024);
          for (let i = 0; i < kromme.length; i++) kromme[i] = Math.tanh(1.6 * (i / 511.5 - 1)) / Math.tanh(1.6);
          warm.curve = kromme;
          warm.oversample = "2x";
          const demper = audio.createBiquadFilter();
          demper.type = "lowpass";
          demper.frequency.value = 7000;
          demper.Q.value = 0.5;
          meester.connect(warm).connect(demper).connect(begrenzer).connect(audio.destination);
          audio.resume().catch(() => {});
        } catch (_err) { audio = null; }
      }
      geluidAan();
      ["pointerdown", "keydown"].forEach((naam) => window.addEventListener(naam, geluidAan));
      function klik({ hoogte = 3000, scherpte = 2, duur = 0.008, sterkte = 0.3, dof = 0, wanneer = 0 }) {
        if (!audio || audio.state !== "running") return;
        sterkte *= TIK_HARDER;
        const nu = audio.currentTime + wanneer;
        const bronGeluid = audio.createBufferSource();
        bronGeluid.buffer = ruis;
        const filter = audio.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = hoogte * (0.9 + Math.random() * 0.2);
        filter.Q.value = scherpte;
        const gain = audio.createGain();
        gain.gain.setValueAtTime(sterkte, nu);
        gain.gain.exponentialRampToValueAtTime(0.0001, nu + duur);
        bronGeluid.connect(filter).connect(gain).connect(meester);
        bronGeluid.start(nu, Math.random() * 0.5, duur + 0.02);
        if (dof) {
          const osc = audio.createOscillator();
          const laag = audio.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(dof * 1.6, nu);
          osc.frequency.exponentialRampToValueAtTime(dof, nu + 0.03);
          laag.gain.setValueAtTime(sterkte * 0.9, nu);
          laag.gain.exponentialRampToValueAtTime(0.0001, nu + 0.07);
          osc.connect(laag).connect(meester);
          osc.start(nu);
          osc.stop(nu + 0.09);
        }
      }
      // Een toon: driehoek en sinus, een fractie uit elkaar gestemd, door een eigen demper.
      function toon({ hoogte = 880, naar = 0, duur = 0.1, sterkte = 0.2, wanneer = 0, inzet = 0.003, wiebel = 0 }) {
        if (!audio || audio.state !== "running") return;
        const nu = audio.currentTime + wanneer, eind = nu + inzet + duur;
        const zweef = 1 + (Math.random() - 0.5) * 0.006;
        const filter = audio.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = Math.min(6000, hoogte * 3);
        filter.Q.value = 0.6;
        const gain = audio.createGain();
        gain.gain.setValueAtTime(0.0001, nu);
        gain.gain.exponentialRampToValueAtTime(sterkte, nu + inzet);
        gain.gain.exponentialRampToValueAtTime(0.0001, eind);
        let golf = null;
        if (wiebel) {
          const lfo = audio.createOscillator();
          lfo.frequency.value = 4.5;
          golf = audio.createGain();
          golf.gain.value = hoogte * wiebel;
          lfo.connect(golf);
          lfo.start(nu);
          lfo.stop(eind + 0.05);
        }
        [["triangle", 1.003, 0.7], ["sine", 0.997, 0.5]].forEach(([vorm, factor, deel]) => {
          const osc = audio.createOscillator();
          osc.type = vorm;
          osc.frequency.setValueAtTime(hoogte * factor * zweef, nu);
          if (naar) osc.frequency.exponentialRampToValueAtTime(naar * factor * zweef, nu + Math.min(duur, 0.12));
          if (golf) golf.connect(osc.frequency);
          const stem = audio.createGain();
          stem.gain.value = deel;
          osc.connect(stem).connect(filter);
          osc.start(nu);
          osc.stop(eind + 0.05);
        });

      }
      // Een zwiep: ruis waarvan het filter open schuift.
      function zwiep({ van = 300, tot = 2600, duur = 0.5, sterkte = 0.25, wanneer = 0 }) {
        if (!audio || audio.state !== "running") return;
        const nu = audio.currentTime + wanneer;
        const bronGeluid = audio.createBufferSource();
        bronGeluid.buffer = ruis;
        bronGeluid.loop = true;
        const filter = audio.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 1.4;
        filter.frequency.setValueAtTime(van, nu);
        filter.frequency.exponentialRampToValueAtTime(tot, nu + duur);
        const gain = audio.createGain();
        gain.gain.setValueAtTime(0.0001, nu);
        gain.gain.exponentialRampToValueAtTime(sterkte, nu + duur * 0.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, nu + duur);
        bronGeluid.connect(filter).connect(gain).connect(meester);
        bronGeluid.start(nu);
        bronGeluid.stop(nu + duur + 0.05);
      }
      // Niet vaker dan eens per zoveel milliseconden, per soort geluid.
      const laatst = {};
      function mag(soort, ms) {
        const nu = performance.now();
        if (nu - (laatst[soort] || 0) < ms) return false;
        laatst[soort] = nu;

      }
      const geluid = {
        // Cijfers tellen op: een toon die meeloopt met hoe ver het is (0 tot 1).
        tel(deel = 0) {
          if (!mag("tel", 38)) return;
          toon({ hoogte: 660 * (1 + 0.65 * Math.min(1, Math.max(0, deel))), duur: 0.025, sterkte: 0.1 });
        },
        // Een chatbericht komt binnen: een fijne tik.
        chat() {
          if (!mag("chat", 60)) return;
          klik({ hoogte: 5200, scherpte: 4, duur: 0.006, sterkte: 0.3 });
        },
        // De tekst wordt geschreven: radertjes. Twee metalige tikjes per stukje tekst, hoog en laag, en
        // een doffe klap aan het eind van een regel.
        typ(regelEinde) {

          if (!mag("typ", 50)) return;

        // Een regel of vlak verschijnt: een doffe klik, als een diaprojector.

        slot() {

        },
      };

      // ── Stand van het scherm ──────────────────────────────────────────────────────────────────
      let universum = null;      // laatste melding van het universum
      let gekozen = null;        // de scène waar de kiezer op geland is: { id, titel, omgeving, score }
      let speel = null;          // de scène die speelt of net gespeeld is: { titel, omgeving }
      let omgevingVan = null;    // laatst bekende omgeving bij een scène: { id, omgeving }
      let hierna = null;         // uit het laatste rapport: { titel, score } van de scène die het algoritme koos
      let inScene = false;       // TouchDesigner zegt: de scène speelt
      let laagWeg = false;       // het vel is helemaal uit beeld geschoven
      let joinUrl = "";
      const stem = { actief: false, pollId: 0, opties: [], counts: [], endsAt: 0, winnaar: -1, tot: 0 };
      const rapport = { aan: false, data: null, speelt: false, haalt: false, vraag: 0 };

      const VLAKKEN = ["meedoen", "stemmen", "stemqr", "titel", "tekst", "chat", "voet", "rapport", "camera", "ranking", "spelers", "stem", "schrijf", "stemspelers"];
      const FASE_VLAKKEN = {
        inloop: ["meedoen", "chat", "camera", "spelers"],
        stemmen: ["stemmen", "stemqr", "chat", "camera", "spelers"],
        kiezen: ["chat", "voet", "ranking", "spelers"],
        gekozen: ["titel", "chat", "voet", "ranking", "spelers"],
        tekst: ["titel", "tekst", "chat", "voet", "ranking", "spelers"],
        scene: ["chat", "voet"],
        rapport: ["rapport"],
        // De scène is voorbij: stemmen, en eronder wordt de volgende scène geschreven.
        stem: ["stem", "schrijf", "stemspelers"],
      };
      function bepaalFase() {
        const u = universum || {};
        if (rapport.aan) return "rapport";
        if (stemFase.tot > Date.now()) return "stem";
        if (stem.actief || stem.tot > Date.now()) return "stemmen";
        if (u.volgende) return "tekst";
        if (gekozen) return "gekozen";
        // De scène begint: titel en tekst blijven staan tot het vel ermee uit beeld is.
        if (u.speelt) return faseSinds && !laagWeg ? "tekst" : "scene";
        if (!u.gespeeld) return "inloop";
        return "kiezen";
      }
      const teken = (n, cijfers = 1) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("nl-NL", { minimumFractionDigits: cijfers, maximumFractionDigits: cijfers });
      function zetKop(node, tekst, kort, middel) {
        const titel = String(tekst || "");
        if (node.textContent !== titel) node.textContent = titel;
        node.classList.toggle("lang", titel.length > kort && titel.length <= middel);
        node.classList.toggle("langer", titel.length > middel);
      }
      // Beeld van de omgeving: foto of video uit de catalogus (poort 3021), in kleur.
      function zetBeeld(box, omgeving) {

        if (box.dataset.adres === adres) return;

        box.hidden = !adres;

        const media = document.createElement(omgeving.soort === "video" ? "video" : "img");
        if (omgeving.soort === "video") { media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true; }
        media.addEventListener("error", () => { box.hidden = true; });

        box.appendChild(media);
      }
      function vulTitel(fase) {

        const bron = gekozen && (!u.volgende || u.sceneId === gekozen.id) ? gekozen : { titel: u.titel, omgeving: u.omgeving || (omgevingVan && omgevingVan.id === u.sceneId ? omgevingVan.omgeving : null), score: null };
        zetKop(el("titelTekst"), bron.titel, 22, 40);

        el("titelScore").textContent = fase === "gekozen" && bron.score != null ? teken(bron.score) : "";
      }

      // Zet de vlakken van de fase in beeld: eerst wat weg moet eruit, dan wat nieuw is erin.
      let faseNu = "", toonTimer = 0, stemGevraagd = "";
      // ── Live camerabeeld ──────────────────────────────────────────────────────────────────────
      // De stroom loopt alleen terwijl het vlak in beeld is; het vlak komt pas als er een beeld binnen is.
      let cameraBinnen = false, cameraStop = null;
      const cameraAan = () => getal(settings.tussenCameraBreedte, 380) > 0 && cameraBinnen;
      el("cameraBeeld").addEventListener("load", () => { if (!cameraBinnen) { cameraBinnen = true; zetFase(); } });
      el("cameraBeeld").addEventListener("error", () => { cameraBinnen = false; });
      function volgCamera(aan) {
        const img = el("cameraBeeld");
        clearTimeout(cameraStop);
        if (aan || (!cameraBinnen && getal(settings.tussenCameraBreedte, 380) > 0 && ["inloop", "stemmen"].includes(bepaalFase()))) {

      function plaatsCamera() {
