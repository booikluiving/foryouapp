        vlak.style.left = getal(settings.tussenCameraX, 640) + "px";
        vlak.style.top = getal(settings.tussenCameraY, 1720) + "px";
        vlak.style.width = Math.max(1, getal(settings.tussenCameraBreedte, 380)) + "px";
      }

      // ── Ranking, spelers en de stemlijn ───────────────────────────────────────────────────────
      let ranking = [];
      function tekenRanking(lijst) {
        ranking = Array.isArray(lijst) ? lijst.slice(0, 5) : [];
        const vlak = el("p-ranking");
        vlak.textContent = "";
        if (ranking.length) vlak.appendChild(maak("div", "klein", "top commenter"));
        for (const rij of ranking) {
          const r = maak("div", "rankrij" + (rij.plek === 1 ? " eerst" : ""));
          const naam = maak("span", "", rij.naam || "Anoniem");
          r.append(maak("span", "", String(rij.plek)), naam, maak("b", "", String(rij.punten)));
          vlak.appendChild(r);
        }
        zetFase();
      }
      // De spelers die zich klaarmaken: het laatste beeld per plek, alleen terwijl de vensters in beeld zijn.
      // Eerst de doorlopende stroom (soepel beeld uit TouchDesigner). Is die er niet, dan elke 0,7 s
      // een los beeld per speler (zoals in de proef), en af en toe opnieuw de stroom proberen.
      let spelersTimer = 0, spelersAan = false, stroomAan = false, stroomProbeer = 0;
      const spelerRijen = () => document.querySelectorAll(".spelerrij");
      function spelersGeen() { spelerRijen().forEach((rij) => rij.classList.toggle("geen", !rij.querySelector(".speler:not(.leeg)"))); }
      function stroomStop() {
        stroomAan = false;
        spelerRijen().forEach((rij) => { rij.classList.remove("stroom"); rij.querySelectorAll("img").forEach((img) => { img.onload = img.onerror = null; img.removeAttribute("src"); }); rij.querySelectorAll(".speler").forEach((v) => v.classList.add("leeg")); });
        spelersGeen();
      }
      function stroomStart() {
        clearTimeout(stroomProbeer);
        const adres = `/audience/stage/spelers-stroom?ts=${Date.now()}`;
        const proef = new Image();
        proef.onload = () => {
          proef.onload = proef.onerror = null;
          proef.src = "";
          if (!spelersAan) return;
          stroomAan = true;
          clearInterval(spelersTimer);
          spelersTimer = 0;
          spelerRijen().forEach((rij) => {
            rij.classList.add("stroom");
            rij.querySelectorAll(".speler").forEach((venster) => {
              const img = venster.firstElementChild;
              img.onload = () => { venster.classList.remove("leeg"); spelersGeen(); };
              // De stroom is opgehouden: terug naar de losse beelden.
              img.onerror = () => { if (stroomAan) { stroomStop(); if (spelersAan) losseBeelden(); } };
              img.src = adres;
            });
          });
        };
        proef.onerror = () => { if (spelersAan && !stroomAan) stroomProbeer = setTimeout(stroomStart, 5000); };
        proef.src = adres;
      }
      function losseBeelden() {
        if (spelersTimer || stroomAan) return;
        const haal = () => {
          [1, 2, 3].forEach((plek) => {
            const beeld = new Image();
            const vensters = document.querySelectorAll(`.spelerrij .speler:nth-child(${plek})`);
            beeld.onload = () => { if (stroomAan) return; vensters.forEach((venster) => { if (beeld.naturalWidth) { venster.firstElementChild.src = beeld.src; venster.classList.remove("leeg"); } else venster.classList.add("leeg"); }); spelersGeen(); };
            beeld.onerror = () => { if (stroomAan) return; vensters.forEach((venster) => venster.classList.add("leeg")); spelersGeen(); };
            beeld.src = `/audience/stage/spelerbeeld/${plek}?ts=${Date.now()}`;
          });
        };
        haal();
        spelersTimer = setInterval(haal, 700);
        stroomProbeer = setTimeout(stroomStart, 5000);
      }
      function volgSpelers(aan) {
        if (aan === spelersAan) return;
        spelersAan = aan;
        if (aan) { losseBeelden(); stroomStart(); }
        else {
          clearInterval(spelersTimer);
          spelersTimer = 0;
          clearTimeout(stroomProbeer);
          if (stroomAan) stroomStop();
        }
      }

      // ── Stemmen na de scène ───────────────────────────────────────────────────────────────────
      // De vragen gaan open: bovenaan "Stem nu op je telefoon" met de QR-code, in het midden de klok,
      // eerst groot, dan schuift hij omhoog en wordt de cirkel rondgetrokken. De balk vult zich met wie
      // gestemd heeft; de uitslag is niet te zien. Staat de klok op zijn plek, dan begint het schrijven
      // van de volgende scène, in het venster onderin. Als het stemmen voorbij is,
      // gaat het universum verder: nieuwe scènes komen vrij en de kiezer landt op de geschreven scène.
      // Eerst staat de klok groot in het midden (GROOT_MS), dan schuift hij in OMHOOG_MS naar zijn plek.
      // Het schrijven begint als de klok op zijn plek staat.
      const GROOT_MS = 1800, OMHOOG_MS = 800, SCHRIJF_NA_MS = 2800, CIRKEL = 2 * Math.PI * 230;
      const stemFase = { id: "", opent: 0, tot: 0, schrijf: false, schrijfGevraagd: "", lus: 0, schrijfTimer: 0 };
      let tekstGemeld = "", wachtUniversum = false, tekstTijdensStemmen = false;
      el("stemLoop").style.strokeDasharray = String(CIRKEL);
      el("stemLoop").style.strokeDashoffset = String(CIRKEL);
      function zetStemGetal(waarde, geluidje) {
        const span = el("stemGetal").firstElementChild;
        if (span.textContent === String(waarde)) return;
        span.textContent = String(waarde);
        span.classList.remove("tik");
        void span.offsetWidth;
        span.classList.add("tik");
        if (geluidje) geluidje();
      }
      function tekenStem() {
        stemFase.lus = 0;
        const nu = Date.now();
        if (stemFase.tot <= nu) { stemKlaar(); return; }
        const vlak = el("p-stem"), loop = el("stemLoop");
        const duur = Math.max(1, stemFase.tot - stemFase.opent), over = Math.min(duur, stemFase.tot - nu), s = Math.ceil(over / 1000);
        const sinds = nu - stemFase.opent;
        const tik = () => (s <= 5 ? geluid.aftel(s) : geluid.seconde(s));
        if (sinds < GROOT_MS) {
          // Groot in het midden: de klok loopt al.
          vlak.classList.add("groot");
          vlak.classList.remove("klok");
          loop.style.strokeDashoffset = String(CIRKEL);
          zetStemGetal(s, tik);
        } else if (sinds < GROOT_MS + OMHOOG_MS) {
          // Het getal schuift omhoog naar zijn plek en de cirkel wordt rondgetrokken tot waar de klok is.
          if (vlak.classList.contains("groot")) { vlak.classList.remove("groot"); geluid.schakel(); }
          const p = (sinds - GROOT_MS) / OMHOOG_MS, rond = Math.min(1, Math.max(0, (p - 0.4) / 0.6));
          loop.style.strokeDashoffset = String(CIRKEL * (1 - rond * (over / duur)));
          zetStemGetal(s, tik);
        } else {
          vlak.classList.remove("groot");
          vlak.classList.add("klok");
          loop.style.strokeDashoffset = String(CIRKEL * (1 - over / duur));
          zetStemGetal(s, tik);
        }
        if (stemFase.schrijfGevraagd !== stemFase.id && sinds >= SCHRIJF_NA_MS) vraagSchrijven();
        stemFase.lus = requestAnimationFrame(tekenStem);
      }
      // Het schrijven van de volgende scène begint; het venster komt pas als er echt geschreven wordt
      // (in de startfase kiest het publiek de scène nog, dan blijft het weg).
      function vraagSchrijven() {
        const id = stemFase.id;
        stemFase.schrijfGevraagd = id;
        fetch("/audience/stage/tekst-in-beeld?tijdensStemmen=1", { method: "POST" })
          .then((res) => res.json())
          .then((uit) => {
            if (stemFase.id !== id || !uit) return;
            if (uit.gestuurd || ["al_gestuurd", "tekst_is_er", "schrijft_al"].includes(uit.reden)) { stemFase.schrijf = true; tekstTijdensStemmen = true; zetFase(); }
          })
          .catch(() => {});
      }
      function stemNu(beoordeling) {
        const nu = Date.now();
        if (beoordeling && beoordeling.id) {
          const opent = Number.isFinite(beoordeling.aanloopMs) ? nu + beoordeling.aanloopMs : Date.parse(beoordeling.opentAt || beoordeling.endsAt || "") || 0;
          const tot = Number.isFinite(beoordeling.overMs) ? nu + beoordeling.overMs : Date.parse(beoordeling.endsAt || "") || 0;
          if (tot <= nu) { if (stemFase.tot) stemKlaar(); return; }
          if (beoordeling.id !== stemFase.id) {
            stemFase.id = String(beoordeling.id);
            stemFase.schrijf = false;
            tekstTijdensStemmen = false;
            el("stemGetal").firstElementChild.textContent = "";
          }
          stemFase.opent = opent;
          stemFase.tot = tot;
          // Het schrijven begint twee seconden na de start van de klok (ook als het scherm even niet tekent).
          clearTimeout(stemFase.schrijfTimer);
          stemFase.schrijfTimer = setTimeout(() => {
            if (stemFase.schrijfGevraagd !== stemFase.id && stemFase.tot > Date.now()) vraagSchrijven();
          }, Math.max(0, opent + SCHRIJF_NA_MS - nu));
          stemVoortgang(beoordeling);
          if (!stemFase.lus) stemFase.lus = requestAnimationFrame(tekenStem);
          zetFase();
        } else if (stemFase.tot) stemKlaar();
      }
      function stemKlaar() {
        clearTimeout(stemFase.schrijfTimer);
        if (stemFase.lus) cancelAnimationFrame(stemFase.lus);
        stemFase.lus = 0;
        const was = !!stemFase.tot;
        stemFase.tot = 0;
        // De vragen zijn dicht: nu mag (in de startfase) de stemming op de volgende scène open, en het
        // universum gaat verder.
        stemGevraagd = "";
        zetFase();
        if (was && wachtUniversum) { wachtUniversum = false; setTimeout(universumVerder, SNEL ? 120 : 450); }
      }
      // Iemand stemt: de balk vult zich met wie gestemd heeft. Waarop, is niet te zien.
      function stemVoortgang(msg, nieuw) {
        const gestemd = Number(msg && msg.gestemd) || 0;
        const mensen = Math.max(Number(msg && msg.mensen) || 0, gestemd);
        el("stemBalk").firstElementChild.style.width = (mensen ? (gestemd / mensen) * 100 : 0) + "%";
        el("stemTal").textContent = `${gestemd} van de ${mensen} hebben gestemd`;
        if (nieuw && stemFase.tot > Date.now()) geluid.stem();
      }

      function zetFase(direct) {
        const fase = bepaalFase();
        const wil = new Set(FASE_VLAKKEN[fase]);
        if (!joinUrl) { wil.delete("meedoen"); wil.delete("stemqr"); wil.delete("voet"); }
        if (!cameraAan()) wil.delete("camera");
        volgCamera(wil.has("camera"));
        stage.classList.toggle("metcamera", wil.has("camera"));
        // De ranking komt pas als het stemmen voorbij is en er iets te tonen valt.
        if (!ranking.length || stemFase.tot > Date.now()) wil.delete("ranking");
        if (!stemFase.schrijf) wil.delete("schrijf");
        // De tekst is al tijdens het stemmen geschreven: na de keuze komt het venster niet terug.
        if (tekstTijdensStemmen) wil.delete("tekst");
        stage.classList.toggle("stemfase", fase === "stem");
        volgSpelers(wil.has("spelers") || wil.has("stemspelers"));
        if (fase === "gekozen" || fase === "tekst") vulTitel(fase);
        // Het venster met de tekst komt in beeld: de scène die klaarstaat gaat vanzelf naar de chat
        // van de script-agent (één keer per scène; show control houdt dat bij).
        if (fase === "tekst" && universum && universum.volgende && tekstGemeld !== String(universum.sceneId || "x")) {
          tekstGemeld = String(universum.sceneId || "x");
          fetch("/audience/stage/tekst-in-beeld", { method: "POST" }).catch(() => {});
        }
        // Het scherm is klaar voor een stemming (inloop van een lopende run, of het rapport is voorbij):
        // in de startfase gaat de stemming dan vanzelf open. De publieksdienst beslist en doet het
        // één keer per startscène.
        if ((fase === "inloop" || fase === "kiezen") && universum && universum.actief && !universum.speelt) {
          const sleutel = `${fase}|${universum.gespeeld}`;
          if (sleutel !== stemGevraagd) {
            stemGevraagd = sleutel;
            fetch("/audience/stage/stemmen-mag", { method: "POST" }).catch(() => {});
          }
        }
        faseNu = fase;
        // Staat het vel niet in beeld, dan hoeft er niets te schuiven.
        const stil = !!direct || laagWeg;
        if (stil) stage.classList.add("direct");
        let gingWeg = false;
        for (const naam of VLAKKEN) {
          const vlak = el("p-" + naam);
          if (!wil.has(naam) && !vlak.classList.contains("uit")) { vlak.classList.add("uit"); gingWeg = true; }
        }
        clearTimeout(toonTimer);
        const toon = () => {
          let kwam = false;
          for (const naam of VLAKKEN) {
            const vlak = el("p-" + naam);
            if (wil.has(naam) && vlak.classList.contains("uit")) { vlak.classList.remove("uit"); kwam = true; }
          }
          if (kwam && !stil) geluid.relais();
        };
        if (stil || !gingWeg) toon(); else toonTimer = setTimeout(toon, SNEL ? 180 : 300);
        if (stil) { void stage.offsetHeight; stage.classList.remove("direct"); }
      }

      const zelfdeTitel = (a, b) => String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
      window.addEventListener("message", (ev) => {
        const stand = ev.data;
        if (!stand || stand.bron !== "for_you-universum") return;
        // De kiezer in het universum: een tik per sprong, een klap met bel bij de keuze.
        if (stand.tik) {
          if (stand.tik === "slot") {
            geluid.slot();
            if (stand.omgeving) omgevingVan = { id: stand.sceneId, omgeving: stand.omgeving };
            gekozen = { id: stand.sceneId, titel: stand.titel, omgeving: stand.omgeving || null, score: hierna && zelfdeTitel(hierna.titel, stand.titel) ? hierna.score : null };
            // De stemlijst maakt plaats voor de titel van de winnaar.
            stem.actief = false;
            stem.tot = 0;
          } else {
            geluid.stap();
            gekozen = null;
          }
          zetFase();
          return;
        }
        const vorige = universum;
        universum = stand;
        if (!vorige) meldZicht();
        if (stand.omgeving && stand.sceneId) omgevingVan = { id: stand.sceneId, omgeving: stand.omgeving };
        // Een nieuwe run of een reset: wat er nog stond hoort bij de vorige. Ook als er in die run
        // nog niets gespeeld was (alleen gekozen): dan staat het inloopscherm er weer.
        const andereRun = !!vorige && (stand.gespeeld < vorige.gespeeld || (vorige.actief && !stand.actief) || String(stand.sessie || "") !== String(vorige.sessie || ""));
        if (andereRun) { gekozen = null; hierna = null; tekstGemeld = ""; tekstTijdensStemmen = false; rapportWeg(); }
        if (stand.speelt && !(vorige && vorige.speelt && vorige.sceneId === stand.sceneId)) {
          speel = { titel: stand.titel, omgeving: omgevingVan && omgevingVan.id === stand.sceneId ? omgevingVan.omgeving : null };
          gekozen = null;
          tekstOpnieuw();
        }
        if (vorige && vorige.speelt && !stand.speelt && stand.gespeeld >= vorige.gespeeld) haalRapport();
        herzie();
      });
      // Loopt de scène en is het vel weg, dan staat het rapport alvast klaar: het scherm komt ermee terug.
      function herzie() {
        if (laagWeg && universum && universum.speelt && !rapport.aan) rapportKlaarzetten();
        zetFase();
      }

      // ── Rapport ───────────────────────────────────────────────────────────────────────────────
      const rpNl = (n, cijfers = 1) => Math.abs(n).toLocaleString("nl-NL", { minimumFractionDigits: cijfers, maximumFractionDigits: cijfers });
      let rpTimers = [], rpRonde = 0;
      function rpRij(links, rechts, klasse) {
        const node = maak("div", "rij" + (klasse ? " " + klasse : ""));
        node.append(maak("span", "", links), maak("b", "", rechts));
        return node;
      }
      function rpTelOp(node, doel, ms, vorm) {
        const begin = performance.now();
        const mijn = rpRonde;
        let vorige = "";
        const stapje = (nu) => {
          if (mijn !== rpRonde) return;
          const deel = Math.min(1, (nu - begin) / ms);
          const tekst = vorm(doel * (1 - Math.pow(1 - deel, 3)));
          if (tekst !== vorige) { node.textContent = tekst; vorige = tekst; geluid.tel(deel); }
          if (deel < 1) requestAnimationFrame(stapje);
        };
        requestAnimationFrame(stapje);
      }
      function rpBlad(nr, stil) {
        [0, 1, 2, 3].forEach((index) => el("rp" + index).classList.toggle("weg", index !== nr));
        if (!stil) geluid.schakel();
      }
      function rpLeeg() {
        rpTimers.forEach(clearTimeout);
        rpTimers = [];
        rpRonde++;
        ["rpReacties", "rpSom", "rpLabels", "rpCam"].forEach((id) => el(id).replaceChildren());
        ["rpCamKop", "rpCamMeta", "rpCamUitleg"].forEach((id) => { el(id).textContent = ""; });
        el("rpScore").textContent = "";
        el("rpMeta").textContent = "";
        rpBlad(0, true);
      }
      function rapportWeg() {
        const was = rapport.aan;
        rapport.vraag++;
        rapport.aan = false;
        rapport.data = null;
        rapport.speelt = false;
        rapport.haalt = false;
        rpTimers.forEach(clearTimeout);
        rpTimers = [];
        rpRonde++;
        if (was) zetFase();
      }
      // Het rapport staat klaar met de titel van de scène; de cijfers volgen zodra het algoritme ze heeft.
      function rapportKlaarzetten() {
        if (!RAPPORT) return;
        rpLeeg();
        zetKop(el("rpTitel"), (speel && speel.titel) || (ronde && ronde.titel) || "", 16, 30);
        zetBeeld(el("rpBeeld"), speel && speel.omgeving);
        rapport.aan = true;
        rapport.data = null;
        rapport.speelt = false;
        zetFase();
      }
      // Scène afgelopen: het rapport ophalen. Het algoritme heeft even nodig om de scène te verwerken;
      // komt het rapport niet, dan gaat het scherm zonder verder.
      async function haalRapport() {
        if (!RAPPORT) {
          // Geen rapport: het universum wacht tot het stemmen voorbij is. Gaan er geen vragen open,
          // dan gaat het na een paar seconden toch verder.
          wachtUniversum = true;
          setTimeout(() => { if (wachtUniversum && stemFase.tot <= Date.now()) { wachtUniversum = false; universumVerder(); } }, 6000);
          return;
        }
        if (rapport.haalt || rapport.data) return;
        if (!rapport.aan) rapportKlaarzetten();
        rapport.haalt = true;
        const vraag = ++rapport.vraag;
        const situationRunId = ronde && ronde.situationRunId ? ronde.situationRunId : "";
        let data = null;
        for (let poging = 0; poging < 12 && vraag === rapport.vraag; poging++) {
          try {
            const antwoord = await fetch(`/audience/stage/rapport?situationRunId=${encodeURIComponent(situationRunId)}&ts=${Date.now()}`, { cache: "no-store" }).then((res) => res.json());
            if (antwoord && antwoord.klaar) { data = antwoord; break; }
          } catch (_err) {}
          await new Promise((resolve) => setTimeout(resolve, 600));
        }
        if (vraag !== rapport.vraag) return;
        rapport.haalt = false;
        if (!data) { rapportWeg(); universumVerder(); return; }
        rapport.data = data;
        probeerRapport();
      }
      // Het tellen begint pas als het vel weer in beeld is.
      function probeerRapport() {
        if (!rapport.aan || !rapport.data || rapport.speelt || inScene) return;
        rapport.speelt = true;
        const mijn = rapport.vraag;
        setTimeout(() => { if (mijn === rapport.vraag && rapport.aan) speelRapport(rapport.data); }, 560);
      }
      function rapportKlaar() {
        if (rapport.data) hierna = rapport.data.hierna || null;
        rapportWeg();
        // Eerst schuift het rapport weg, dan zoomt het universum uit.
        setTimeout(universumVerder, 320);
      }
      // Speelt het rapport af. De eerste keer rustig, elke volgende scène sneller. Bij de tiende scène
      // is het op zijn snelst (RAPPORT_SNELST van de eerste duur); daarna blijft het zo.
      function speelRapport(data) {
        rpLeeg();
        const mijn = rpRonde;
        const scene = data.scene, som = data.som;
        const tempo = Math.max(RAPPORT_SNELST, Math.pow(RAPPORT_SNELST, (Math.max(1, Number(scene.nr) || 1) - 1) / (RAPPORT_SNELST_BIJ - 1)));
        const straks = (ms, fn) => rpTimers.push(setTimeout(() => { if (mijn === rpRonde) fn(); }, ms * tempo));
        zetKop(el("rpTitel"), scene.titel, 16, 30);
        const camera = scene.camera;
        el("rpMeta").textContent = `${scene.seconden} seconden · ${scene.kijkers} kijkers`;
        let t = 500;

        // 1. Reacties: de emoji die het publiek indrukte, de berichten, en het geluid in de zaal.
        const emojiVan = (telt) => reacties.filter((r) => r.telt === telt).map((r) => r.emoji).join("");
        const tellingen = [[emojiVan("positief"), "positief", scene.hartjes], [emojiVan("negatief"), "negatief", scene.verveeld], ["", "berichten", scene.berichten]];
        const meeste = Math.max(scene.hartjes, scene.verveeld, scene.berichten, 1);
        tellingen.forEach(([emoji, woord, waarde]) => {
          const rij = rpRij("", "0");
          if (emoji) rij.firstElementChild.append(maak("span", "emoji", emoji));
          rij.firstElementChild.append(woord);
          const meter = maak("div", "meter");
          const vulling = maak("i");
          meter.append(vulling);
          rij.append(meter);
          el("rpReacties").append(rij);
          straks(t, () => {
            rij.classList.add("aan");
            rpTelOp(rij.querySelector("b"), waarde, 450 * tempo, (n) => String(Math.round(n)));
            requestAnimationFrame(() => { vulling.style.width = `${(waarde / meeste) * 100}%`; });
          });
          t += 520;
        });
        if (scene.geluid) {
          const NS = "http://www.w3.org/2000/svg";
          const rij = rpRij(`zaalgeluid, piek (rust ${Math.round(scene.geluid.rustDb)} dB)`, "0 dB");
          const golf = document.createElementNS(NS, "svg");
          golf.setAttribute("class", "golf");
          golf.setAttribute("viewBox", `0 0 ${scene.geluid.golf.length * 4} 60`);
          golf.setAttribute("preserveAspectRatio", "none");
          rij.append(golf);
          el("rpReacties").append(rij);
          straks(t, () => {
            rij.classList.add("aan");
            rpTelOp(rij.querySelector("b"), scene.geluid.piekDb, 1000 * tempo, (n) => `${Math.round(n)} dB`);
          });
          scene.geluid.golf.forEach((db, index) => {
            straks(t + index * (1000 / scene.geluid.golf.length), () => {
              const hoogte = Math.max(1, Math.min(1, Math.max(0.04, (db - 50) / 35)) * 56);
              const staaf = document.createElementNS(NS, "rect");
              staaf.setAttribute("x", index * 4);
              staaf.setAttribute("y", 30 - hoogte / 2);
              staaf.setAttribute("width", 2);
              staaf.setAttribute("height", hoogte);
              golf.append(staaf);
            });
          });
          t += 1000;
        }
        t += 1500;

        // 1b. Wat de camera zag: hoeveel procent lachte of verveeld keek, en wie.
        if (camera) {
          straks(t, () => {
            rpBlad(3);
            el("rpCamKop").textContent = String(settings.rapportCameraKop || "");
            el("rpCamMeta").textContent = `${camera.personen} mensen in de zaal`;
            el("rpCamUitleg").textContent = String(settings.rapportCameraUitleg || "");
          });
          t += 600;
          // De zaal in twee helften, met per gezicht hoeveel procent van de scène die persoon lachte of verveeld keek.
          const groepen = camera.groepen || {};
          [
            ["vonden het het leukst", "lachen", groepen.leukst || []],
            ["verveelden zich het meest", "verveeld", groepen.verveeld || []],
          ].forEach(([kop, woord, gezichten]) => {
            if (!gezichten.length) return;
            const rij = rpRij(kop, "");
            el("rpCam").append(rij);
            straks(t, () => rij.classList.add("aan"));
            t += 400;
            const raster = maak("div", "lachjes");
            el("rpCam").append(raster);
            gezichten.forEach((gezicht) => {
              const tegel = maak("figure", "gezicht");
              const img = maak("img");
              img.alt = "";
              img.src = gezicht.src;
              tegel.append(img, maak("figcaption", "", `${gezicht.pct}% ${woord}`));
              raster.append(tegel);
              straks(t, () => { tegel.classList.add("aan"); geluid.relais(); });
              t += 150;
            });
            t += 400;
          });
          if ((groepen.leukst || []).length || (groepen.verveeld || []).length) {
            const regel = maak("div", "klein niet-bewaard", "De foto's worden niet opgeslagen.");
            el("rpCam").append(regel);
            straks(t, () => regel.classList.add("aan"));
          }
          // De gezichten blijven ruim in beeld, ook als het rapport later sneller gaat.
          t += 7000 / tempo;
        }

        // 2. De som, regel voor regel, tot de score.
        straks(t, () => rpBlad(1));
        const maal = (n) => (n < 0 ? "−" : "") + rpNl(n, Number.isInteger(n) ? 0 : 2);
        const regels = [
          [`${scene.hartjes} positief × ${maal(som.wHart)}`, teken(scene.hartjes * som.wHart)],
          [`${scene.verveeld} negatief × ${maal(som.wVerveeld)}`, teken(scene.verveeld * som.wVerveeld)],
          [`${scene.berichten} berichten × ${maal(som.wBericht)}`, teken(scene.berichten * som.wBericht)],
        ];
        if (scene.geluid && som.wGeluid) regels.push([`zaalgeluid ${rpNl(scene.geluid.liftDb)} dB boven rust × ${maal(som.wGeluid)}`, teken(som.geluid)]);
        if (camera && som.wLach) regels.push([`${camera.lachmomenten} keer lachen × ${maal(som.wLach)}`, teken(som.lachen)]);
        if (camera && som.wSaai) regels.push([`${camera.saaieMomenten} keer saai × ${maal(som.wSaai)}`, teken(som.saai)]);
        regels.push(
          ["som", teken(som.ruw), "streep"],
          [`duur: ${scene.seconden} seconden`, `× ${rpNl(som.duur, 2)}`],
          [`publiek: ${scene.kijkers} kijkers`, `× ${rpNl(som.publiek, 2)}`],
        );
        regels.forEach(([links, rechts, extra], index) => {
          const rij = rpRij(links, rechts, "som" + (extra ? " " + extra : ""));
          el("rpSom").append(rij);
          straks(t + 350 + index * 280, () => { rij.classList.add("aan"); geluid.relais(); });
        });
        t += 350 + regels.length * 280 + 150;
        const score = el("rpScore");
        // Het grote getal past altijd op de regel.
        score.style.fontSize = `${Math.min(400, Math.floor(960 / (teken(scene.score).length * 0.58)))}px`;
        straks(t, () => rpTelOp(score, scene.score, 800 * tempo, teken));
        straks(t + 850, () => geluid.slot());
        t += 2700;

        // 3. Dit publiek: de stand per label.
        straks(t, () => rpBlad(2));
        // Alle labels staan er; een label waar nog geen scène van gespeeld is heeft nog geen score.
        const bereik = Math.max(...data.labels.map((label) => Math.abs(label.score || 0)), 0.01);
        data.labels.forEach((label, index) => {
          const heeft = label.score != null;
          const staaf = maak("div", "staaf" + (label.nu ? " nu" : "") + (heeft ? "" : " leeg"));
          const spoor = maak("div", "spoor");
          const vulling = maak("i");
          spoor.append(vulling);
          staaf.append(maak("span", "", label.naam), spoor, maak("b", "", heeft ? teken(label.score) : ""));
          el("rpLabels").append(staaf);
          straks(t + 350 + index * 200, () => {
            staaf.classList.add("aan");
            geluid.relais();
            if (heeft) requestAnimationFrame(() => { vulling.style.width = `${(Math.abs(label.score) / bereik) * 100}%`; });
          });
        });
        t += 350 + data.labels.length * 200 + 2600;
        straks(t, rapportKlaar);
      }

      // ── Meedoen: QR-code en adres ─────────────────────────────────────────────────────────────
      async function tekenQr() {
        const data = await fetch("/audience/admin/state?stage=qr&ts=" + Date.now(), { cache: "no-store" }).then((res) => res.json());
        const url = (data.sessionJoin && data.sessionJoin.joinUrl) || "";
        if (url === joinUrl) return;
        joinUrl = typeof qrcode === "function" ? url : "";
        if (joinUrl) {
          const qr = qrcode(0, "M");
          qr.addData(joinUrl);
          qr.make();
          const beeld = qr.createImgTag(8, 0);
          document.querySelectorAll("[data-qr]").forEach((box) => { box.innerHTML = beeld; });
          // Het adres zoals je het overtikt: zonder https, www en sleutel.
          const adres = joinUrl.replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/[?#].*$/, "").replace(/\/$/, "");
          document.querySelectorAll("[data-adres]").forEach((node) => { node.textContent = adres; });
        }
        zetFase();
      }
      tekenQr().catch(() => {});
      setInterval(() => tekenQr().catch(() => {}), 5000);

      // ── Stemmen op de startscène ──────────────────────────────────────────────────────────────
      function tekenStemmen() {
        const lijst = el("stemLijst");
        const kop = el("stemKop");
        const kopTekst = stem.startscene ? `${stem.startscene.nummer}/${stem.startscene.van}` : "";
        if (kop.dataset.tekst !== kopTekst) {
          kop.dataset.tekst = kopTekst;
          kop.replaceChildren(...(kopTekst ? [maak("b", "", kopTekst), maak("span", "", "Startscène")] : []));
        }
        if (lijst.children.length !== stem.opties.length) {
          lijst.replaceChildren(...stem.opties.map((titel) => {
            const rij = maak("div", "stemrij");
            const spoor = maak("div", "spoor");
            spoor.append(maak("i"));
            rij.append(maak("span", "", titel), spoor, maak("b", "", "0"));
            return rij;
          }));
        }
        const hoogste = Math.max(1, ...stem.counts.map((n) => Number(n) || 0));
        [...lijst.children].forEach((rij, index) => {
          const n = Number(stem.counts[index]) || 0;
          rij.querySelector("span").textContent = stem.opties[index];
          rij.querySelector("b").textContent = String(n);
          rij.querySelector("i").style.width = `${(n / hoogste) * 100}%`;
          const eerst = stem.winnaar >= 0 ? index === stem.winnaar : n > 0 && n === hoogste;
          rij.classList.toggle("eerst", eerst);
          rij.classList.toggle("af", stem.winnaar >= 0 && index !== stem.winnaar);
        });
      }
      function tekenKlok() {
        const over = stem.actief && stem.endsAt ? Math.max(0, Math.ceil((stem.endsAt - Date.now()) / 1000)) : 0;
        // De laatste STEM_AFTELLEN seconden staat alleen het getal er, groot.
        const laatste = stem.actief && over > 0 && over <= STEM_AFTELLEN;
        const tekst = laatste ? String(over) : `${Math.floor(over / 60)}:${String(over % 60).padStart(2, "0")}`;
        const klok = el("stemKlok");
        if (klok.textContent === tekst) return;
        klok.textContent = tekst;
        klok.classList.toggle("laatste", laatste);
        if (!stem.actief || !over || faseNu !== "stemmen" || inScene) return;
        // Elke seconde een tik; in de laatste seconden een piep en een stootje in het getal.
        if (laatste) {
          geluid.aftel(over);
          klok.classList.remove("tik");
          void klok.offsetWidth;
          klok.classList.add("tik");
        } else {
          geluid.seconde(over);
        }
      }
      const STEM_AFTELLEN = 10;
      setInterval(tekenKlok, 250);
      function stemStart(poll) {
        if (!poll || !Array.isArray(poll.options)) return;
        stem.actief = true;
        stem.pollId = Number(poll.id);
        stem.opties = poll.options.slice();
        stem.startscene = poll.startscene && poll.startscene.van > 0 ? { nummer: Number(poll.startscene.nummer), van: Number(poll.startscene.van) } : null;
        stem.counts = (poll.counts || []).slice();
        stem.endsAt = Date.parse(poll.endsAt || "") || 0;
        stem.winnaar = -1;
        stem.tot = 0;
        gekozen = null;
        tekenStemmen();
        tekenKlok();
        zetFase();
      }
      function stemUitslag(msg) {
        if (Number(msg.pollId) !== stem.pollId || !msg.uitslag) return;
        stem.actief = false;
        stem.counts = (msg.uitslag.counts || stem.counts).slice();
        stem.winnaar = Number(msg.uitslag.index);
        // De lijst blijft staan tot de kiezer in het universum op de winnaar landt.
        stem.tot = Date.now() + 8000;
        setTimeout(() => zetFase(), 8100);
        tekenStemmen();
        tekenKlok();
        geluid.slot();
        zetFase();
      }

      // ── De tekst die gemaakt wordt ────────────────────────────────────────────────────────────
      // Het venster toont de pagina van de script-agent zelf (poort 3027), op de maat van het venster.
      // De laadbalk volgt dezelfde stroom: hoeveel regels er al zijn van de ongeveer achttien die een
      // scène telt. Als de tekst af is staat hij vol.
      const SCRIPT_SCHAAL = 0.6, TEKST_REGELS = 18;
      (() => {
        const frame = el("scriptFrame");
        const breedte = Math.round(636 / SCRIPT_SCHAAL), hoogte = Math.round(146 / SCRIPT_SCHAAL);
        frame.style.width = breedte + "px";
        frame.style.height = hoogte + "px";
        frame.style.transform = `scale(${SCRIPT_SCHAAL})`;
        frame.src = `${opPoort(SCRIPT_POORT)}/script-agent/operator/stage?doorzichtig=1&venster=1&b=${breedte}&h=${hoogte}`;
      })();
      // Hetzelfde voor het venster onder de klok tijdens het stemmen: groter en doorzichtig.
      (() => {
        const frame = el("scriptFrame2"), schaal = 0.85;
        const breedte = Math.round(856 / schaal), hoogte = Math.round(264 / schaal);
        frame.style.width = breedte + "px";
        frame.style.height = hoogte + "px";
        frame.style.transform = `scale(${schaal})`;
        frame.src = `${opPoort(SCRIPT_POORT)}/script-agent/operator/stage?doorzichtig=1&venster=1&b=${breedte}&h=${hoogte}`;
      })();
      const tekst = { bezig: false, inhoud: "", id: "", klaar: false, regels: 0 };
      function tekenLaad() {
        const regels = tekst.inhoud.split("\n").filter((regel) => regel.trim()).length;
        const procent = tekst.bezig ? Math.min(96, Math.round((regels / TEKST_REGELS) * 100)) : tekst.klaar ? 100 : 0;
        el("laadVul").style.width = procent + "%";
        el("laadVul2").style.width = procent + "%";
        const getalTekst = procent + "%";
        if (el("laadGetal").textContent !== getalTekst) {
          el("laadGetal").textContent = getalTekst;
          el("laadGetal2").textContent = getalTekst;
          if (tekst.bezig && faseNu === "tekst") geluid.tel(procent / 100);
          if (procent === 100 && faseNu === "tekst") geluid.slot();
        }
      }
      // Een nieuwe scène begint: de tekst voor de volgende moet nog gemaakt worden.
      function tekstOpnieuw() {
        if (tekst.bezig) return;
        tekst.inhoud = "";
        tekst.klaar = false;
        tekenLaad();
      }
      function tekstStroom() {
        let ws;
        const opnieuw = () => setTimeout(tekstStroom, 4000);
        try { ws = new WebSocket(`${wsOpPoort(SCRIPT_POORT)}/v0/script-agent/operator/stage/ws`); } catch (_err) { opnieuw(); return; }
        ws.addEventListener("close", opnieuw);
        ws.addEventListener("message", (ev) => {
          let msg;
          try { msg = JSON.parse(String(ev.data || "{}")); } catch (_err) { return; }
          if (msg.type === "operator_stage_hello" || msg.type === "operator_stage_state") {
            const st = msg.stage || {};
            const laatste = (Array.isArray(st.messages) ? st.messages : []).filter((m) => m && m.role === "assistant").pop();
            const was = tekst.bezig;
            tekst.bezig = !!st.streaming;
            if (laatste && (tekst.bezig || was || msg.type === "operator_stage_hello")) {
              tekst.inhoud = String(laatste.content || "");
              tekst.id = String(laatste.id || "");
            }
            if (!tekst.bezig && (was || msg.type === "operator_stage_hello")) tekst.klaar = !!tekst.inhoud.trim();
            tekenLaad();
          } else if (msg.type === "operator_stage_delta") {
            const id = String(msg.assistantId || "");
            if (id !== tekst.id) { tekst.id = id; tekst.inhoud = ""; }
            tekst.bezig = true;
            tekst.klaar = false;
            tekst.inhoud = typeof msg.fullText === "string" ? msg.fullText : tekst.inhoud + String(msg.text || "");
            tekenLaad();
            const regels = tekst.inhoud.split("\n").length;
            if ((faseNu === "tekst" || (faseNu === "stem" && stemFase.schrijf)) && !inScene) geluid.typ(regels > tekst.regels);
            tekst.regels = regels;
          }
        });
      }
      tekstStroom();

      // ── De fase van TouchDesigner ─────────────────────────────────────────────────────────────
      // 0 inloop, 1 loading, 2 scène. Bij de scène schuift het vel omhoog weg en blijven alleen de
      // emoji en de ondertitel over het camerabeeld staan; daarna komt het dezelfde weg terug. De
      // laatste fase wordt onthouden, zodat een herladen pagina goed begint.
      let eenGeladen = false, faseSinds = 0, wegTimer = 0;
      function eenLagen() {
        if (eenGeladen) return;
        eenGeladen = true;
        el("emoji").src = "/audience/stage/emoji";
        el("ondertitel").src = `${opPoort(3027)}/script-agent/teleprompter-parser/live-captions`;
      }
      window.forYouFase = (fase, direct) => {
        const scene = Number(fase) === 2;
        document.documentElement.classList.add("een");
        document.body.classList.add("een");
        eenLagen();
        faseSinds = Date.now();
        try { localStorage.setItem("for_you_fase", JSON.stringify({ fase: scene ? 2 : 1, at: faseSinds })); } catch (_err) {}
        if (scene === inScene) return;
        inScene = scene;
        if (!direct) geluid.schakel();
        clearTimeout(wegTimer);
        if (direct) stage.classList.add("direct");
        document.body.classList.toggle("scene", scene);
        if (!scene) el("sceneChat").textContent = "";
        if (direct) { void stage.offsetHeight; stage.classList.remove("direct"); }
        if (scene) {
          // Is het vel uit beeld, dan wordt alles klaargezet voor als het terugkomt.
          wegTimer = setTimeout(() => { laagWeg = true; herzie(); }, direct ? 0 : 560);
        } else {
          laagWeg = false;
          // Terug uit de scène: het rapport ophalen als dat nog niet gebeurd is, en beginnen met tellen.
          if (rapport.aan && !rapport.data) haalRapport(); else probeerRapport();
        }
      };
      try {
        const bewaard = JSON.parse(localStorage.getItem("for_you_fase") || "null");
        if (bewaard && Date.now() - bewaard.at < 10000) window.forYouFase(bewaard.fase, true);
      } catch (_err) {}
      // Vangnet: geeft TouchDesigner de fase niet meer door, dan wordt de pagina weer gewoon het
      // dekkende scherm van inloop en loading.
      setInterval(() => {
        if (!faseSinds || Date.now() - faseSinds < 10000) return;
        faseSinds = 0;
        inScene = false;
        laagWeg = false;
        clearTimeout(wegTimer);
        stage.classList.add("direct");
        document.documentElement.classList.remove("een");
        document.body.classList.remove("een", "scene");
        void stage.offsetHeight;
        stage.classList.remove("direct");
        probeerRapport();
        zetFase();
      }, 2000);

      function pas() {
        const s = Math.min(window.innerWidth / W, window.innerHeight / H);
        const tx = (window.innerWidth - W * s) / 2, ty = (window.innerHeight - H * s) / 2;
        stage.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      }
      window.addEventListener("resize", pas);
      pas();

      // ── Chat ──────────────────────────────────────────────────────────────────────────────────
      function toepassen(next) {
        settings = next || settings || {};
        plaatsCamera();
        const plek = chatPlek();
        const vlak = el("p-chat");
        vlak.style.top = plek.y + "px";
        vlak.style.height = plek.hoogte + "px";
        vlak.style.fontSize = plek.letter + "px";
        if (meester) meester.gain.value = geluidVolume();
        meldZicht();
        tekenChat();
      }
      // De naam krijgt de kleur van de kijker, maar gedempt en donker.
      function dof(kleur) {
        const hex = /^#[0-9a-f]{6}$/i.test(String(kleur || "")) ? kleur : "";
        if (!hex) return "";
        const deel = (i) => Math.round(parseInt(hex.slice(i, i + 2), 16) * 0.58 + 10);
        return `rgb(${deel(1)}, ${deel(3)}, ${deel(5)})`;
      }
      // Reacties van deze ronde; de comment met de meeste likes staat bovenaan.
      let berichten = [];
      // Elke regel wordt één keer gemaakt en daarna hergebruikt.
      const regelEls = new WeakMap();
      function vulRegel(r, msg) {
        r.textContent = "";
        const naam = maak("b", "", msg.name || "Anoniem");
        const kleur = dof(msg.nameColor);
        if (kleur) naam.style.color = kleur;
        r.append(naam, document.createTextNode(msg.text));
        if (msg.likes > 0) r.appendChild(maak("span", "likes", " ♥ " + msg.likes));
        r.dataset.likes = String(msg.likes || 0);
      }
      function regelEl(msg) {
        let r = regelEls.get(msg);
        if (!r) {
          r = maak("div", "chatregel");
          vulRegel(r, msg);
          regelEls.set(msg, r);
        } else if (r.dataset.likes !== String(msg.likes || 0)) {
          vulRegel(r, msg);
        }
        return r;
      }
      // Zet de juiste elementen op hun plek zonder bestaande regels weg te halen.
      function zetKinderen(ouder, lijst) {
        for (const kind of [...ouder.children]) if (!lijst.includes(kind)) kind.remove();
        lijst.forEach((kind, i) => {
          if (ouder.children[i] !== kind) ouder.insertBefore(kind, ouder.children[i] || null);
        });
      }
      function tekenChat() {
        const top = berichten.reduce((best, m) => (m.likes > 0 && (!best || m.likes > best.likes || (m.likes === best.likes && m.id < best.id)) ? m : best), null);
        const lijst = berichten.slice(-MAX_REGELS).filter((m) => m !== top).map(regelEl);
        const vast = top ? regelEl(top) : null;
        berichten.forEach((m) => { const r = regelEls.get(m); if (r) r.classList.toggle("vast", r === vast); });
        const c = el("chatRegels");
        zetKinderen(c, vast ? [vast, ...lijst] : lijst);
        // Wat niet past valt er aan de bovenkant af, in hele regels.
        const ruimte = el("p-chat").clientHeight;
        const eerste = vast ? 1 : 0;
        while (ruimte > 0 && c.offsetHeight > ruimte && c.children.length > eerste + 1) c.children[eerste].remove();
      }
      // stil: een bericht dat er bij het laden al stond geeft geen tik.
      function regel(msg, stil) {
        if (!msg || msg.system || !msg.text) return;
        if (ronde && ronde.start && msg.time && Date.parse(msg.time) < Date.parse(ronde.start)) return;
        if (msg.id && berichten.some((m) => m.id === msg.id)) return;
        berichten.push({ id: Number(msg.id) || 0, name: msg.name, nameColor: msg.nameColor, text: msg.text, likes: Number(msg.likes) || 0, time: msg.time });
        if (berichten.length > 200) berichten = berichten.slice(-200);
        tekenChat();
        if (!stil && !inScene) geluid.chat();
        if (!stil && inScene) sceneRegel(msg);
      }
      // Tijdens de scène verschijnt elk nieuw bericht linksonder over het camerabeeld: hoogstens vijf
      // tegelijk, elk een paar seconden.
      const SCENE_CHAT_MAX = 5, SCENE_CHAT_MS = 9000;
      function sceneRegel(msg) {
        const vak = el("sceneChat");
        const r = maak("div", "");
        const naam = maak("b", "", msg.name || "Anoniem");
        if (msg.nameColor) naam.style.color = msg.nameColor;
        r.append(naam, document.createTextNode(String(msg.text || "").slice(0, 140)));
        vak.appendChild(r);
        while (vak.children.length > SCENE_CHAT_MAX) vak.firstElementChild.remove();
        setTimeout(() => r.remove(), SCENE_CHAT_MS);
      }
      function nieuweRonde(next) {
        const was = ronde && ronde.start;
        ronde = next || ronde;
        if (ronde.start && ronde.start !== was) { berichten = []; tekenChat(); }
      }

      const bron = new EventSource("/audience/stage/stroom");
      bron.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "stage_herlaad") { location.reload(); return; }
        if (msg.type === "begin") {
          toepassen(msg.settings);
          reacties = msg.reacties || [];
          ronde = msg.ronde || ronde;
          berichten = [];
          for (const m of msg.berichten || []) regel(m, true);
          tekenChat();
          if (msg.startStemming) stemStart(msg.startStemming);
          tekenRanking(msg.ranking);
          stemNu(msg.beoordeling);
          zetFase(true);
        } else if (msg.type === "stage_settings") toepassen(msg.stage && msg.stage.settings);
        else if (msg.type === "reacties") reacties = msg.reacties || [];
        else if (msg.type === "fase") nieuweRonde(msg.ronde);
        else if (msg.type === "reaction_update" && msg.ronde) ronde.emoji = msg.ronde;
        else if (msg.type === "comment") regel(msg);
        else if (msg.type === "comment_likes") {
          const m = berichten.find((b) => b.id === Number(msg.id));
          if (m) { m.likes = Number(msg.likes) || 0; tekenChat(); }
        }
        else if (msg.type === "ranking") tekenRanking(msg.ranking);
        else if (msg.type === "beoordeling") stemNu(msg.beoordeling);
        else if (msg.type === "beoordeling_dicht") stemNu(null);
        else if (msg.type === "beoordeling_stem") stemVoortgang(msg, true);
        else if (msg.type === "start_stemming") stemStart(msg.poll);
        else if (msg.type === "poll_update" && Number(msg.pollId) === stem.pollId && stem.actief) { stem.counts = (msg.counts || []).slice(); tekenStemmen(); geluid.stem(); }
        else if (msg.type === "start_stemming_uitslag") stemUitslag(msg);
        else if (msg.type === "session_reset" || msg.type === "session_closed" || msg.type === "chat_reset") {
          berichten = [];
          tekenChat();
          ronde.emoji = {};
        }
      };
      toepassen(settings);
      zetFase(true);
    </script>
  </body>
</html>
