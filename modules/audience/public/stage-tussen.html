<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For_You tussenscherm</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        transform-origin: 0 0;
      }
      #titel {
        position: absolute;
        left: 88px;
        right: 88px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      #script {
        position: absolute;
        left: 0;
        width: 1080px;
        overflow: hidden;
      }
      #script iframe {
        position: absolute;
        left: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: #000;
      }
      #stats {
        position: absolute;
        left: 88px;
        right: 88px;
      }
      #statsScene {
        color: rgba(255, 255, 255, 0.66);
        font-weight: 500;
        margin-bottom: 0.4em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #statsRij {
        display: flex;
        flex-wrap: nowrap;
        gap: 0 0.9em;
        align-items: baseline;
      }
      .telling {
        display: inline-flex;
        align-items: baseline;
        gap: 0.25em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .telling .emoji {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-weight: 400;
      }
      #chat {
        position: absolute;
        left: 88px;
        right: 88px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.45em;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
      }
      .regel {
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .regel.nieuw { animation: erin 260ms ease-out; }
      .naam { font-weight: 700; }
      .likes { color: #ff3b5c; font-weight: 700; white-space: nowrap; }
      #top {
        position: absolute;
        left: 88px;
        right: 88px;
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      #stem {
        position: absolute;
        left: 0;
        width: 1080px;
        box-sizing: border-box;
        padding: 0 88px;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }
      #stem[hidden] { display: none; }
      #stemKop { font-size: 34px; font-weight: 500; color: rgba(255, 255, 255, 0.66); }
      .stemRij { position: relative; opacity: 0.6; transition: opacity 300ms ease; }
      .stemRij.koploper, .stemRij.winnaar { opacity: 1; }
      .stemRij.verloren { opacity: 0.22; }
      .stemTekst { display: flex; justify-content: space-between; gap: 24px; font-size: 38px; font-weight: 700; line-height: 1.12; }
      .stemTekst .n { font-variant-numeric: tabular-nums; }
      .stemBalk { height: 8px; margin-top: 10px; background: rgba(255, 255, 255, 0.14); }
      .stemBalk > span { display: block; height: 100%; width: 0; background: #fff; transition: width 400ms ease; }
      @keyframes erin {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="titel"></div>
      <div id="script"><iframe id="scriptFrame" title="Script" scrolling="no"></iframe></div>
      <div id="stem" hidden></div>
      <div id="stats" hidden>
        <div id="statsScene"></div>
        <div id="statsRij"></div>
      </div>
      <div id="top" hidden></div>
      <div id="chat"></div>
    </div>
    <script>
      const W = 1080, H = 1920, MAX_REGELS = 14;
      const el = (id) => document.getElementById(id);
      const stage = el("stage");
      let settings = {};
      let reacties = [];
      let ronde = { start: null, titel: null, emoji: {} };

      // Het script van de script-agent (poort 3027) op dezelfde machine.
      el("scriptFrame").src = `${location.protocol}//${location.hostname}:3027/script-agent/operator/stage`;

      function pas() {
        const s = Math.min(window.innerWidth / W, window.innerHeight / H);
        const tx = (window.innerWidth - W * s) / 2, ty = (window.innerHeight - H * s) / 2;
        stage.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      }
      window.addEventListener("resize", pas);
      pas();

      const getal = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);

      function toepassen(next) {
        settings = next || settings || {};
        const t = el("titel");
        t.textContent = settings.tussenTitel ?? "Generating next scene";
        t.style.top = getal(settings.tussenTitelY, 110) + "px";
        t.style.fontSize = getal(settings.tussenTitelGrootte, 64) + "px";
        const sh = getal(settings.tussenScriptHoogte, 860);
        el("script").style.top = getal(settings.tussenScriptY, 230) + "px";
        el("script").style.height = sh + "px";
        el("scriptFrame").style.top = (sh - H) + "px"; // onderkant van het script (nieuwste tekst) in beeld
        el("stem").style.top = getal(settings.tussenScriptY, 230) + "px";
        el("stem").style.height = sh + "px";
        el("stats").style.top = getal(settings.tussenStatsY, 1150) + "px";
        el("stats").style.fontSize = getal(settings.tussenStatsGrootte, 88) + "px";
        el("statsScene").style.fontSize = "0.36em";
        const c = el("chat");
        c.style.top = getal(settings.tussenChatY, 1380) + "px";
        c.style.height = getal(settings.tussenChatHoogte, 480) + "px";
        c.style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        el("top").style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        tekenChat();
      }

      function tekenStats() {
        const box = el("stats");
        if (!ronde || !ronde.start) { box.hidden = true; plaatsChat(); return; }
        box.hidden = false;
        el("statsScene").textContent = ronde.titel || "";
        const rij = el("statsRij");
        rij.textContent = "";
        const emoji = ronde.emoji || {};
        const lijst = reacties.length ? reacties.map((r) => r.emoji) : Object.keys(emoji);
        for (const e of lijst) {
          const span = document.createElement("span");
          span.className = "telling";
          const em = document.createElement("span");
          em.className = "emoji";
          em.textContent = e;
          const n = document.createElement("span");
          n.textContent = String(Number(emoji[e] || 0));
          span.append(em, n);
          rij.appendChild(span);
        }
        plaatsChat();
      }

      // Reacties van deze ronde; de comment met de meeste likes staat bovenaan (boven de reacties).
      let berichten = [];
      // Elke regel wordt één keer gemaakt en daarna hergebruikt; alleen nieuwe regels schuiven in beeld.
      // (Alles opnieuw opbouwen liet de hele chat bij elk bericht of elke emoji knipperen.)
      const regelEls = new WeakMap();
      function vulRegel(r, msg) {
        r.textContent = "";
        const naam = document.createElement("span");
        naam.className = "naam";
        naam.textContent = (msg.name || "Anoniem") + " ";
        if (/^#[0-9a-f]{6}$/i.test(String(msg.nameColor || ""))) naam.style.color = msg.nameColor;
        r.append(naam, document.createTextNode(msg.text));
        if (msg.likes > 0) {
          const h = document.createElement("span");
          h.className = "likes";
          h.textContent = " \u2665 " + msg.likes;
          r.appendChild(h);
        }
        r.dataset.likes = String(msg.likes || 0);
      }
      function regelEl(msg) {
        let r = regelEls.get(msg);
        if (!r) {
          r = document.createElement("div");
          r.className = "regel nieuw";
          r.addEventListener("animationend", () => r.classList.remove("nieuw"), { once: true });
          vulRegel(r, msg);
          regelEls.set(msg, r);
        } else if (r.dataset.likes !== String(msg.likes || 0)) {
          vulRegel(r, msg);
        }
        return r;
      }
      // Zet de juiste elementen op hun plek zonder bestaande regels weg te halen.
      function zetKinderen(ouder, lijst) {
        for (const kind of [...ouder.children]) if (!lijst.includes(kind)) kind.remove();
        lijst.forEach((kind, i) => {
          if (ouder.children[i] !== kind) ouder.insertBefore(kind, ouder.children[i] || null);
        });
      }
      function tekenChat() {
        const top = berichten.reduce((best, m) => (m.likes > 0 && (!best || m.likes > best.likes || (m.likes === best.likes && m.id < best.id)) ? m : best), null);
        const t = el("top");
        t.hidden = !top;
        zetKinderen(t, top ? [regelEl(top)] : []);
        const c = el("chat");
        zetKinderen(c, berichten.slice(-MAX_REGELS).filter((m) => m !== top).map(regelEl));
        plaatsChat();
      }
      function plaatsChat() {
        // De chat begint nooit boven de onderkant van de tellingen.
        const stats = el("stats");
        const statsOnder = stats.hidden ? 0 : stats.offsetTop + stats.offsetHeight + 32;
        const chatY = getal(settings.tussenChatY, 1380);
        const chatTop = Math.max(chatY, statsOnder);
        const chatHoogte = Math.max(0, getal(settings.tussenChatHoogte, 480) - (chatTop - chatY));
        const t = el("top");
        t.style.top = chatTop + "px";
        const topHoogte = t.hidden ? 0 : t.offsetHeight + 24;
        const c = el("chat");
        c.style.top = (chatTop + topHoogte) + "px";
        c.style.height = Math.max(0, chatHoogte - topHoogte) + "px";
      }
      function regel(msg) {
        if (!msg || msg.system || !msg.text) return;
        if (ronde && ronde.start && msg.time && Date.parse(msg.time) < Date.parse(ronde.start)) return;
        if (msg.id && berichten.some((m) => m.id === msg.id)) return;
        berichten.push({ id: Number(msg.id) || 0, name: msg.name, nameColor: msg.nameColor, text: msg.text, likes: Number(msg.likes) || 0, time: msg.time });
        if (berichten.length > 200) berichten = berichten.slice(-200);
        tekenChat();
      }

      function nieuweRonde(next) {
        const was = ronde && ronde.start;
        ronde = next || ronde;
        if (ronde.start && ronde.start !== was) { berichten = []; tekenChat(); }
        tekenStats();
      }

      // Stemmen op de startscène: de stand staat op de plek van het script. Na de uitslag blijft
      // de winnaar even staan, daarna komt het script terug.
      let stem = null, stemTimer = null, stemWeg = null;
      function tekenStem() {
        const box = el("stem");
        if (!stem) { box.hidden = true; el("titel").textContent = settings.tussenTitel ?? "Generating next scene"; return; }
        box.hidden = false;
        const counts = stem.counts || [];
        const hoogste = Math.max(0, ...counts);
        const totaal = counts.reduce((a, b) => a + b, 0);
        const over = stem.endsAt ? Math.max(0, Math.ceil((Date.parse(stem.endsAt) - Date.now()) / 1000)) : 0;
        el("titel").textContent = stem.uitslag ? "De eerste scène" : "Kies de eerste scène";
        box.textContent = "";
        const kop = document.createElement("div");
        kop.id = "stemKop";
        kop.textContent = stem.uitslag
          ? (stem.uitslag.geloot === "te_weinig_stemmen" ? "Te weinig stemmen: het lot besliste" : stem.uitslag.geloot === "gelijke_stand" ? "Gelijke stand: het lot besliste" : totaal + " stemmen")
          : "Stem op je telefoon \u00b7 nog " + over + " s \u00b7 " + totaal + " stemmen";
        box.appendChild(kop);
        (stem.options || []).forEach((optie, i) => {
          const n = Number(counts[i] || 0);
          const rij = document.createElement("div");
          rij.className = "stemRij" + (stem.uitslag ? (stem.uitslag.index === i ? " winnaar" : " verloren") : (n > 0 && n === hoogste ? " koploper" : ""));
          const tekst = document.createElement("div");
          tekst.className = "stemTekst";
          const t = document.createElement("span");
          t.textContent = optie;
          const c = document.createElement("span");
          c.className = "n";
          c.textContent = String(n);
          tekst.append(t, c);
          const balk = document.createElement("div");
          balk.className = "stemBalk";
          const vul = document.createElement("span");
          vul.style.width = (hoogste ? Math.round((n / hoogste) * 100) : 0) + "%";
          balk.appendChild(vul);
          rij.append(tekst, balk);
          box.appendChild(rij);
        });
      }
      function zetStem(poll) {
        clearInterval(stemTimer);
        clearTimeout(stemWeg);
        stem = poll ? { id: poll.id, options: poll.options, counts: poll.counts || [], endsAt: poll.endsAt, uitslag: null } : null;
        if (stem) stemTimer = setInterval(tekenStem, 1000);
        tekenStem();
      }

      const bron = new EventSource("/audience/stage/stroom");
      bron.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "stage_herlaad") { location.reload(); return; }
        if (msg.type === "begin") {
          toepassen(msg.settings);
          reacties = msg.reacties || [];
          ronde = msg.ronde || ronde;
          berichten = [];
          for (const m of msg.berichten || []) regel(m);
          zetStem(msg.startStemming || null);
          tekenChat();
          tekenStats();
        } else if (msg.type === "stage_settings") toepassen(msg.stage && msg.stage.settings);
        else if (msg.type === "start_stemming") zetStem(msg.poll);
        else if (msg.type === "poll_update" && stem && Number(msg.pollId) === Number(stem.id)) { stem.counts = msg.counts || stem.counts; tekenStem(); }
        else if (msg.type === "start_stemming_uitslag" && stem && Number(msg.pollId) === Number(stem.id)) {
          clearInterval(stemTimer);
          stem.counts = msg.uitslag.counts || stem.counts;
          stem.uitslag = msg.uitslag;
          tekenStem();
          stemWeg = setTimeout(() => zetStem(null), 12000);
        }
        else if (msg.type === "reacties") { reacties = msg.reacties || []; tekenStats(); }
        else if (msg.type === "fase") nieuweRonde(msg.ronde);
        else if (msg.type === "reaction_update" && msg.ronde) { ronde.emoji = msg.ronde; tekenStats(); }
        else if (msg.type === "comment") regel(msg);
        else if (msg.type === "comment_likes") {
          const m = berichten.find((b) => b.id === Number(msg.id));
          if (m) { m.likes = Number(msg.likes) || 0; tekenChat(); }
        }
        else if (msg.type === "session_reset" || msg.type === "session_closed") {
          berichten = [];
          tekenChat();
          ronde.emoji = {};
          tekenStats();
        }
      };
    </script>
  </body>
</html>
