<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For_You tussenscherm</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        transform-origin: 0 0;
      }
      /* Beeld van de omgeving van de volgende scène: klein linksboven, even groot als de QR-code.
         De achtergrond van een omgeving is drie schermen breed; hier staat alleen het middelste deel. */
      #beeld {
        position: absolute;
        left: 56px;
        top: 56px;
        width: 218px;
        height: 218px;
        border-radius: 14px;
        overflow: hidden;
        background: #050813;
      }
      #beeld[hidden] { display: none; }
      #beeld img, #beeld video {
        position: absolute;
        left: -100%;
        top: 50%;
        width: 300%;
        height: auto;
        transform: translateY(-50%);
        display: block;
      }
      #script {
        position: absolute;
        left: 0;
        width: 1080px;
        overflow: hidden;
      }
      #script iframe {
        position: absolute;
        left: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: #000;
      }
      /* Het script heeft een zwarte ondergrond; zo valt die weg en blijft alleen de tekst over de ster staan. */
      #script {
        mix-blend-mode: screen;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 45%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 45%);
      }
      #stats {
        position: absolute;
        left: 88px;
        right: 88px;
      }
      #statsScene {
        color: rgba(255, 255, 255, 0.66);
        font-weight: 500;
        margin-bottom: 0.4em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #statsRij {
        display: flex;
        flex-wrap: nowrap;
        gap: 0 0.9em;
        align-items: baseline;
      }
      .telling {
        display: inline-flex;
        align-items: baseline;
        gap: 0.25em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .telling .emoji {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-weight: 400;
      }
      #chat {
        position: absolute;
        left: 88px;
        right: 88px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.45em;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
      }
      .regel {
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .regel.nieuw { animation: erin 260ms ease-out; }
      .naam { font-weight: 700; }
      .likes { color: #ff3b5c; font-weight: 700; white-space: nowrap; }
      #top {
        position: absolute;
        left: 88px;
        right: 88px;
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      /* Eén scherm voor inloop en loading: het universum vult het beeld, de rest ligt eroverheen. */
      #universum {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: #050813;
        pointer-events: none;
      }
      /* Het genereren (beeld en script) staat alleen in beeld als de camera in de gekozen ster zit. */
      #gen {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 900ms ease;
      }
      #gen.toon { opacity: 1; }
      #chatBak {
        position: absolute;
        left: 0;
        width: 1080px;
        bottom: 0;
        height: 760px;
        background: linear-gradient(to bottom, rgba(5, 8, 19, 0) 0%, rgba(5, 8, 19, 0.82) 38%, rgba(5, 8, 19, 0.94) 100%);
      }
      #qr {
        position: absolute;
        right: 56px;
        top: 56px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.94);
        border-radius: 14px;
        line-height: 0;
      }
      #qr[hidden] { display: none; }
      #qr img { width: 190px; height: 190px; }
      #stats { opacity: 0; transition: opacity 600ms ease; }
      #stats.toon { opacity: 1; }
      @keyframes erin {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <iframe id="universum" title="Universum" scrolling="no"></iframe>
      <div id="chatBak"></div>
      <div id="gen">
        <div id="beeld" hidden></div>
        <div id="script"><iframe id="scriptFrame" title="Script" scrolling="no"></iframe></div>
      </div>
      <div id="qr" hidden></div>
      <div id="stats" hidden>
        <div id="statsScene"></div>
        <div id="statsRij"></div>
      </div>
      <div id="top" hidden></div>
      <div id="chat"></div>
    </div>
    <script src="/audience/vendor/qrcode-generator.min.js"></script>
    <script>
      const W = 1080, H = 1920, MAX_REGELS = 14;
      const el = (id) => document.getElementById(id);
      const stage = el("stage");
      let settings = {};
      let reacties = [];
      let ronde = { start: null, titel: null, emoji: {} };

      // Het script van de script-agent (poort 3027) op dezelfde machine.
      el("scriptFrame").src = `${location.protocol}//${location.hostname}:3027/script-agent/operator/stage`;

      // Het universum (padendienst, poort 3022) vult het scherm en speelt de reeks: stemmen of kiezen,
      // inzoomen, en na elke scène uitzoomen en nieuwe scènes laten vrijkomen. Het meldt waar het is.
      const NA_SCENE_MS = 6000; // zo lang staan de tellingen van de gespeelde scène in beeld
      el("universum").src = `${location.protocol}//${location.hostname}:3022/universe/stage.html?naScene=${NA_SCENE_MS}&binnenTitel=0`;
      let universum = null, statsWeg = null, statsAan = false;
      // Vangnet: meldt het universum zich niet, dan staat het genereren gewoon in beeld.
      let universumStil = setTimeout(() => { universum = { stil: true }; zetLagen(); }, 12000);
      function zetLagen() {
        const inSter = !!(universum && (universum.stil || (universum.binnen && !universum.speelt)));
        el("gen").classList.toggle("toon", inSter && !statsAan);
        el("stats").classList.toggle("toon", statsAan);
      }
      window.addEventListener("message", (ev) => {
        const stand = ev.data;
        if (!stand || stand.bron !== "for_you-universum") return;
        clearTimeout(universumStil);
        const speelde = !!(universum && universum.speelt);
        universum = stand;
        if (stand.omgeving || !stand.sceneId) zetBeeld(stand.omgeving);
        // Scène afgelopen: eerst kort de tellingen, daarna zoomt het universum uit.
        if (speelde && !stand.speelt && stand.binnen) {
          statsAan = true;
          clearTimeout(statsWeg);
          statsWeg = setTimeout(() => { statsAan = false; zetLagen(); }, NA_SCENE_MS);
        }
        zetLagen();
      });

      // QR-code om mee te doen: altijd klein in de hoek.
      async function tekenQr() {
        const data = await fetch("/audience/admin/state?stage=qr&ts=" + Date.now(), { cache: "no-store" }).then((res) => res.json());
        const url = data.sessionJoin && data.sessionJoin.joinUrl;
        const box = el("qr");
        if (!url || typeof qrcode !== "function") { box.hidden = true; return; }
        if (box.dataset.url === url) return;
        const qr = qrcode(0, "M");
        qr.addData(url);
        qr.make();
        box.innerHTML = qr.createImgTag(8, 0);
        box.dataset.url = url;
        box.hidden = false;
      }
      tekenQr().catch(() => {});
      setInterval(() => tekenQr().catch(() => {}), 5000);

      function pas() {
        const s = Math.min(window.innerWidth / W, window.innerHeight / H);
        const tx = (window.innerWidth - W * s) / 2, ty = (window.innerHeight - H * s) / 2;
        stage.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      }
      window.addEventListener("resize", pas);
      pas();

      const getal = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);

      function toepassen(next) {
        settings = next || settings || {};
        plaatsScript();
        el("stats").style.top = getal(settings.tussenStatsY, 1150) + "px";
        el("stats").style.fontSize = getal(settings.tussenStatsGrootte, 88) + "px";
        el("statsScene").style.fontSize = "0.36em";
        const c = el("chat");
        c.style.top = getal(settings.tussenChatY, 1380) + "px";
        c.style.height = getal(settings.tussenChatHoogte, 480) + "px";
        c.style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        el("top").style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        tekenChat();
      }

      // Alleen de laatste regels van het script staan in beeld, onder het beeld van de omgeving.
      const SCRIPT_Y = 1080, SCRIPT_HOOGTE = 270;
      function plaatsScript() {
        el("script").style.top = SCRIPT_Y + "px";
        el("script").style.height = SCRIPT_HOOGTE + "px";
        el("scriptFrame").style.top = (SCRIPT_HOOGTE - H) + "px";
      }

      // Beeld van de omgeving: foto of video uit de catalogus (poort 3021).
      let beeldNu = "";
      function zetBeeld(omgeving) {
        const adres = omgeving && omgeving.beeld ? `${location.protocol}//${location.hostname}:3021${omgeving.beeld}` : "";
        if (adres === beeldNu) return;
        beeldNu = adres;
        const box = el("beeld");
        box.textContent = "";
        box.hidden = !adres;
        if (!adres) return;
        const media = document.createElement(omgeving.soort === "video" ? "video" : "img");
        if (omgeving.soort === "video") { media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true; }
        media.addEventListener("error", () => { box.hidden = true; });
        media.src = adres;
        box.appendChild(media);
      }

      function tekenStats() {
        const box = el("stats");
        if (!ronde || !ronde.start) { box.hidden = true; plaatsChat(); return; }
        box.hidden = false;
        el("statsScene").textContent = ronde.titel || "";
        const rij = el("statsRij");
        rij.textContent = "";
        const emoji = ronde.emoji || {};
        const lijst = reacties.length ? reacties.map((r) => r.emoji) : Object.keys(emoji);
        for (const e of lijst) {
          const span = document.createElement("span");
          span.className = "telling";
          const em = document.createElement("span");
          em.className = "emoji";
          em.textContent = e;
          const n = document.createElement("span");
          n.textContent = String(Number(emoji[e] || 0));
          span.append(em, n);
          rij.appendChild(span);
        }
        plaatsChat();
      }

      // Reacties van deze ronde; de comment met de meeste likes staat bovenaan (boven de reacties).
      let berichten = [];
      // Elke regel wordt één keer gemaakt en daarna hergebruikt; alleen nieuwe regels schuiven in beeld.
      // (Alles opnieuw opbouwen liet de hele chat bij elk bericht of elke emoji knipperen.)
      const regelEls = new WeakMap();
      function vulRegel(r, msg) {
        r.textContent = "";
        const naam = document.createElement("span");
        naam.className = "naam";
        naam.textContent = (msg.name || "Anoniem") + " ";
        if (/^#[0-9a-f]{6}$/i.test(String(msg.nameColor || ""))) naam.style.color = msg.nameColor;
        r.append(naam, document.createTextNode(msg.text));
        if (msg.likes > 0) {
          const h = document.createElement("span");
          h.className = "likes";
          h.textContent = " \u2665 " + msg.likes;
          r.appendChild(h);
        }
        r.dataset.likes = String(msg.likes || 0);
      }
      function regelEl(msg) {
        let r = regelEls.get(msg);
        if (!r) {
          r = document.createElement("div");
          r.className = "regel nieuw";
          r.addEventListener("animationend", () => r.classList.remove("nieuw"), { once: true });
          vulRegel(r, msg);
          regelEls.set(msg, r);
        } else if (r.dataset.likes !== String(msg.likes || 0)) {
          vulRegel(r, msg);
        }
        return r;
      }
      // Zet de juiste elementen op hun plek zonder bestaande regels weg te halen.
      function zetKinderen(ouder, lijst) {
        for (const kind of [...ouder.children]) if (!lijst.includes(kind)) kind.remove();
        lijst.forEach((kind, i) => {
          if (ouder.children[i] !== kind) ouder.insertBefore(kind, ouder.children[i] || null);
        });
      }
      function tekenChat() {
        const top = berichten.reduce((best, m) => (m.likes > 0 && (!best || m.likes > best.likes || (m.likes === best.likes && m.id < best.id)) ? m : best), null);
        const t = el("top");
        t.hidden = !top;
        zetKinderen(t, top ? [regelEl(top)] : []);
        const c = el("chat");
        zetKinderen(c, berichten.slice(-MAX_REGELS).filter((m) => m !== top).map(regelEl));
        plaatsChat();
      }
      function plaatsChat() {
        // De chat begint nooit boven de onderkant van de tellingen.
        const stats = el("stats");
        const statsOnder = stats.hidden ? 0 : stats.offsetTop + stats.offsetHeight + 32;
        const chatY = getal(settings.tussenChatY, 1380);
        const chatTop = Math.max(chatY, statsOnder);
        const chatHoogte = Math.max(0, getal(settings.tussenChatHoogte, 480) - (chatTop - chatY));
        const t = el("top");
        t.style.top = chatTop + "px";
        const topHoogte = t.hidden ? 0 : t.offsetHeight + 24;
        const c = el("chat");
        c.style.top = (chatTop + topHoogte) + "px";
        c.style.height = Math.max(0, chatHoogte - topHoogte) + "px";
      }
      function regel(msg) {
        if (!msg || msg.system || !msg.text) return;
        if (ronde && ronde.start && msg.time && Date.parse(msg.time) < Date.parse(ronde.start)) return;
        if (msg.id && berichten.some((m) => m.id === msg.id)) return;
        berichten.push({ id: Number(msg.id) || 0, name: msg.name, nameColor: msg.nameColor, text: msg.text, likes: Number(msg.likes) || 0, time: msg.time });
        if (berichten.length > 200) berichten = berichten.slice(-200);
        tekenChat();
      }

      function nieuweRonde(next) {
        const was = ronde && ronde.start;
        ronde = next || ronde;
        if (ronde.start && ronde.start !== was) { berichten = []; tekenChat(); }
        tekenStats();
      }

      // De stemming op de startscène is op dit scherm alleen in het universum te zien (koploper en winnaar lichten op).

      const bron = new EventSource("/audience/stage/stroom");
      bron.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "stage_herlaad") { location.reload(); return; }
        if (msg.type === "begin") {
          toepassen(msg.settings);
          reacties = msg.reacties || [];
          ronde = msg.ronde || ronde;
          berichten = [];
          for (const m of msg.berichten || []) regel(m);
          tekenChat();
          tekenStats();
        } else if (msg.type === "stage_settings") toepassen(msg.stage && msg.stage.settings);
        else if (msg.type === "reacties") { reacties = msg.reacties || []; tekenStats(); }
        else if (msg.type === "fase") nieuweRonde(msg.ronde);
        else if (msg.type === "reaction_update" && msg.ronde) { ronde.emoji = msg.ronde; tekenStats(); }
        else if (msg.type === "comment") regel(msg);
        else if (msg.type === "comment_likes") {
          const m = berichten.find((b) => b.id === Number(msg.id));
          if (m) { m.likes = Number(msg.likes) || 0; tekenChat(); }
        }
        else if (msg.type === "session_reset" || msg.type === "session_closed" || msg.type === "chat_reset") {
          berichten = [];
          tekenChat();
          ronde.emoji = {};
          tekenStats();
        }
      };
    </script>
  </body>
</html>
