<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For_You tussenscherm</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        transform-origin: 0 0;
      }
      /* Eén pagina voor het hele hoofdscherm. Krijgt de pagina de fase van TouchDesigner
         (window.forYouFase), dan is ze buiten de scène dekkend en tijdens de scène doorzichtig, met
         alleen de emoji en de ondertitel over het camerabeeld. Zonder dat signaal blijft ze het
         scherm van inloop en loading, zoals altijd. */
      html.een, html.een body, html.een #stage { background: transparent; }
      #tussenlaag {
        position: absolute;
        inset: 0;
        background: #000;
        transition: transform 650ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      body.scene #tussenlaag { transform: translateY(-100%); }
      #ondertitel, #emoji {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: transparent;
        pointer-events: none;
        visibility: hidden;
      }
      body.een #emoji { visibility: visible; }
      body.scene #ondertitel { visibility: visible; }
      /* Beeld van de omgeving van de volgende scène: klein linksboven, even groot als de QR-code.
         Eén beeld per omgeving. Welke uitsnede staat per omgeving in omgevingsbeeld.json (universum). */
      #beeld {
        position: absolute;
        left: 56px;
        top: 56px;
        width: 218px;
        height: 218px;
        border-radius: 14px;
        overflow: hidden;
        background: #07080b;
      }
      #beeld[hidden] { display: none; }
      #beeld img, #beeld video {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* De achtergrond is drie schermen breed; "midden" toont alleen het middelste deel. */
      #beeld[data-uitsnede="midden"] img, #beeld[data-uitsnede="midden"] video {
        left: -100%;
        top: 50%;
        width: 300%;
        height: auto;
        object-fit: fill;
        transform: translateY(-50%);
      }
      /* In de ster: de titel van de scène, met eronder de tekst die regel voor regel binnenloopt. */
      /* De titel staat bovenaan, tussen het beeld van de omgeving (links) en de QR-code (rechts). */
      #genTitel, #statsScene {
        position: absolute;
        left: 298px;
        right: 298px;
        top: 56px;
        height: 218px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.01em;
        text-wrap: balance;
        overflow: hidden;
        color: #fff8d6;
      }
      /* De operator-chat is de pagina van de script-agent zelf, zoals die altijd was. De zwarte
         ondergrond valt weg, zodat alleen de tekst over de ster staat. */
      #script {
        position: absolute;
        left: 0;
        width: 1080px;
        overflow: hidden;
        mix-blend-mode: screen;
      }
      #script iframe {
        position: absolute;
        left: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: transparent;
      }
      /* Na een scène: de titel van de gespeelde scène op dezelfde plek, met de tellingen eronder. */
      #stats {
        position: absolute;
        inset: 0;
      }
      #statsRij {
        position: absolute;
        left: 88px;
        right: 88px;
        top: 400px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.3em 0.9em;
        align-items: baseline;
      }
      .telling {
        display: inline-flex;
        align-items: baseline;
        gap: 0.25em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .telling .emoji {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-weight: 400;
      }
      #chat {
        position: absolute;
        left: 88px;
        right: 88px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.45em;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
      }
      .regel {
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .regel.nieuw { animation: erin 260ms ease-out; }
      .naam { font-weight: 700; }
      .likes { color: #ff3b5c; font-weight: 700; white-space: nowrap; }
      #top {
        position: absolute;
        left: 88px;
        right: 88px;
        line-height: 1.18;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      /* Eén scherm voor inloop en loading: het universum vult het beeld, de rest ligt eroverheen. */
      #universum {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        background: #07080b;
        pointer-events: none;
      }
      /* Het genereren (beeld en script) staat alleen in beeld als de camera in de gekozen ster zit. */
      /* De onderdelen vervagen elk apart. Zou het hele blok vervagen, dan staat de operator-chat tijdens
         het invloeien even als zwart vlak in beeld: zijn zwarte ondergrond valt alleen weg zolang hij
         rechtstreeks over het universum ligt. */
      #gen {
        position: absolute;
        inset: 0;
      }
      #gen > * { opacity: 0; transition: opacity 900ms ease; }
      #gen.toon > * { opacity: 1; }
      #chatBak {
        position: absolute;
        left: 0;
        width: 1080px;
        bottom: 0;
        height: 760px;
        background: linear-gradient(to bottom, rgba(7, 8, 11, 0) 0%, rgba(7, 8, 11, 0.82) 38%, rgba(7, 8, 11, 0.94) 100%);
      }
      #qr {
        position: absolute;
        right: 56px;
        top: 56px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.94);
        border-radius: 14px;
        line-height: 0;
      }
      #qr[hidden] { display: none; }
      #qr img { width: 190px; height: 190px; }
      #stats { opacity: 0; transition: opacity 1400ms ease; }
      #stats.toon { opacity: 1; }
      /* Rapportvenster na een scène, in de stijl van foryouniverse.nl: wit op nacht, dunne lijn,
         taakbalk onderin. Het zweeft groot boven het universum en klapt dicht tot zijn titelbalk
         zodra het universum de volgende scène gaat kiezen. */
      #rapport {
        position: absolute;
        left: 119px;
        top: 365px;
        width: 842px;
        height: 1098px;
        border: 1px solid #fff;
        background: rgba(7, 8, 11, 0.9);
        color: #fff;
        display: flex;
        flex-direction: column;
        container-type: inline-size;
        animation: rapport-zweef 13s ease-in-out infinite alternate;
        z-index: 3;
      }
      #rapport[hidden] { display: none; }
      #rapport.klein { top: 300px; height: auto; }
      #rapport.klein .rp-inhoud, #rapport.klein .rp-balk.onder { display: none; }
      #rapport.klein .rp-balk.boven { border-bottom: 0; }
      @keyframes rapport-zweef { from { transform: translate(-6px, -9px); } to { transform: translate(6px, 9px); } }
      .rp-balk { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 3cqw; padding: 0 2.4cqw; font-size: 3cqw; }
      .rp-balk.boven { height: 7cqw; border-bottom: 1px solid #fff; }
      .rp-balk.onder { height: 9.4cqw; border-top: 1px solid #fff; }
      .rp-balk span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .rp-voortgang { display: flex; align-items: center; gap: 2.6cqw; color: rgba(255, 255, 255, 0.66); font-variant-numeric: tabular-nums; flex: none; }
      .rp-baan { width: 12cqw; height: 1px; background: rgba(255, 255, 255, 0.3); position: relative; }
      .rp-baan i { position: absolute; left: 0; top: 0; height: 1px; width: 0; background: #fff; }
      .rp-inhoud { position: relative; flex: 1; min-height: 0; }
      .rp-laag { position: absolute; inset: 6cqw 6cqw 5cqw; display: flex; flex-direction: column; }
      .rp-laag.weg { visibility: hidden; }
      .rp-kop { font-weight: 700; font-size: 7.4cqw; line-height: 1.04; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
      .rp-onderkop { font-size: 3cqw; color: rgba(255, 255, 255, 0.66); margin-top: 1.6cqw; }
      .rp-rijen { margin-top: auto; display: grid; }
      .rp-rij { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 4cqw; padding: 2cqw 0; border-top: 1px solid rgba(255, 255, 255, 0.3); opacity: 0; }
      .rp-rij.aan { opacity: 1; }
      .rp-rij.streep { border-top: 1px solid #fff; }
      .rp-rij span { font-size: 3cqw; color: rgba(255, 255, 255, 0.66); min-width: 0; overflow-wrap: anywhere; }
      .rp-rij b { font-size: 6.6cqw; font-weight: 700; letter-spacing: -0.025em; line-height: 1; font-variant-numeric: tabular-nums; }
      .rp-rij.som { padding: 1.5cqw 0; }
      .rp-rij.som span { font-size: 3.6cqw; color: #fff; line-height: 1.15; }
      .rp-rij.som b { font-size: 4.8cqw; }
      .rp-rij.top span { font-size: 4.6cqw; color: #fff; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
      .rp-meter { grid-column: 1 / -1; height: 3px; margin-top: 1.4cqw; position: relative; }
      .rp-meter::before { content: ""; position: absolute; left: 0; right: 0; top: 1px; height: 1px; background: rgba(255, 255, 255, 0.3); }
      .rp-meter i { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: #fff; transition: width 500ms cubic-bezier(.65, 0, .35, 1); }
      .rp-golf { grid-column: 1 / -1; width: 100%; height: 15cqw; margin-top: 1.4cqw; display: block; }
      .rp-golf rect { fill: #fff; }
      .rp-groot { font-weight: 700; font-size: 27cqw; line-height: 0.86; letter-spacing: -0.045em; margin: 2cqw 0 0 -0.05em; font-variant-numeric: tabular-nums; opacity: 0; }
      .rp-groot.aan { opacity: 1; }
      .rp-staaf { display: grid; grid-template-columns: 37% 1fr 15%; align-items: center; gap: 3cqw; padding: 1.5cqw 0; opacity: 0; }
      .rp-staaf.aan { opacity: 1; }
      .rp-staaf span { font-size: 3.8cqw; color: rgba(255, 255, 255, 0.66); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rp-staaf b { font-size: 4.4cqw; font-weight: 700; letter-spacing: -0.025em; text-align: right; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, 0.66); }
      .rp-staaf.nu span, .rp-staaf.nu b { color: #fff; }
      .rp-spoor { position: relative; height: 2cqw; }
      .rp-spoor i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(255, 255, 255, 0.3); transition: width 500ms cubic-bezier(.65, 0, .35, 1); }
      .rp-staaf.nu .rp-spoor i { background: #fff; }
      #rpHiernaKop { font-size: 3cqw; color: rgba(255, 255, 255, 0.66); margin-top: 3cqw; visibility: hidden; }
      @keyframes erin {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
     <div id="tussenlaag">
      <iframe id="universum" title="Universum" scrolling="no"></iframe>
      <div id="chatBak"></div>
      <div id="gen">
        <div id="beeld" hidden></div>
        <div id="genTitel"></div>
        <div id="script"><iframe id="scriptFrame" title="Script" scrolling="no"></iframe></div>
      </div>
      <div id="qr" hidden></div>
      <div id="stats" hidden>
        <div id="statsScene"></div>
        <div id="statsRij"></div>
      </div>
      <div id="rapport" hidden>
        <div class="rp-balk boven"><span>Rapport</span><span id="rpScene"></span></div>
        <div class="rp-inhoud">
          <div id="rp0" class="rp-laag">
            <h2 id="rpTitel" class="rp-kop"></h2>
            <div id="rpMeta" class="rp-onderkop"></div>
            <div id="rpReacties" class="rp-rijen"></div>
          </div>
          <div id="rp1" class="rp-laag weg">
            <h2 class="rp-kop">Berekening</h2>
            <div id="rpScore" class="rp-groot"></div>
            <div id="rpSom" class="rp-rijen"></div>
          </div>
          <div id="rp2" class="rp-laag weg">
            <h2 class="rp-kop">Dit publiek</h2>
            <div id="rpLabels" class="rp-rijen"></div>
            <div id="rpHiernaKop">Hierna</div>
            <div id="rpTop" class="rp-rijen" style="margin-top:0"></div>
          </div>
        </div>
        <div class="rp-balk onder">
          <span id="rpStap"></span>
          <span class="rp-voortgang"><span id="rpStapNr"></span><span class="rp-baan"><i id="rpBaan"></i></span></span>
        </div>
      </div>
      <div id="top" hidden></div>
      <div id="chat"></div>
     </div>
      <iframe id="ondertitel" title="Ondertitel" scrolling="no"></iframe>
      <iframe id="emoji" title="Emoji" scrolling="no"></iframe>
    </div>
    <script src="/audience/vendor/qrcode-generator.min.js"></script>
    <script>
      const W = 1080, H = 1920, MAX_REGELS = 14;
      const el = (id) => document.getElementById(id);
      const stage = el("stage");
      let settings = {};
      let reacties = [];
      let ronde = { start: null, titel: null, emoji: {} };

      // Het universum (padendienst, poort 3022) vult het scherm en speelt de reeks: stemmen of kiezen,
      // inzoomen, en na elke scène uitzoomen en nieuwe scènes laten vrijkomen. Het meldt waar het is.
      // Na een scène wacht het universum met uitzoomen tot het rapport is getoond en dit scherm het vrijgeeft.
      // NA_SCENE_MAX is het vangnet: komt de vrijgave niet, dan gaat het universum na die tijd vanzelf verder.
      const NA_SCENE_MS = 3000; // zo lang staan titel en tellingen in beeld als er geen rapport is
      const NA_SCENE_MAX = 30000;
      // De poort van het universum is alleen op een proefopstelling anders (?universumPoort=…).
      const UNIVERSUM_POORT = Number(new URLSearchParams(location.search).get("universumPoort")) || 3022;
      el("universum").src = `${location.protocol}//${location.hostname}:${UNIVERSUM_POORT}/universe/stage.html?naScene=${NA_SCENE_MAX}&vrijgave=1&binnenTitel=0`;
      function universumVerder() {
        try { el("universum").contentWindow.postMessage({ bron: "for_you-scherm", verder: true }, "*"); } catch (_err) {}
      }
      let universum = null, statsWeg = null, statsAan = false;
      let rapportFase = 0; // 0 geen rapport, 1 rapport in beeld (camera nog in de ster), 2 universum is uitgezoomd
      // Vangnet: meldt het universum zich niet, dan staat het genereren gewoon in beeld.
      let universumStil = setTimeout(() => { universum = { stil: true }; zetLagen(); }, 12000);
      function zetLagen() {
        const inSter = !!(universum && (universum.stil || (universum.binnen && !universum.speelt)));
        el("gen").classList.toggle("toon", inSter && !statsAan && !rapportFase);
        el("stats").classList.toggle("toon", statsAan);
      }
      window.addEventListener("message", (ev) => {
        const stand = ev.data;
        if (!stand || stand.bron !== "for_you-universum") return;
        // De kiezer in het universum: een tik per sprong, een klap met bel bij de keuze.
        if (stand.tik) { if (stand.tik === "slot") geluid.slot(); else geluid.stap(); return; }
        clearTimeout(universumStil);
        const speelde = !!(universum && universum.speelt);
        universum = stand;
        if (stand.omgeving || !stand.sceneId) zetBeeld(stand.omgeving);
        // Scène afgelopen: titel en tellingen in de ster. Ze vervagen zodra het universum gaat uitzoomen.
        // Het rapport hoort bij de scène die net gespeeld is. Zodra het universum is uitgezoomd en
        // daarna in de volgende ster zit, is ook de titelbalk weg.
        if (rapportFase && !stand.binnen) rapportFase = 2;
        else if (rapportFase === 2 && stand.binnen) rapportWeg();
        if (speelde && !stand.speelt && stand.binnen) {
          toonRapport();
        } else if (stand.binnen && stand.speelt) {
          rapportWeg();
        } else if (statsAan && !stand.binnen) {
          statsAan = false;
          clearTimeout(statsWeg);
        }
        if (stand.binnen && !stand.speelt && !statsAan) {
          el("genTitel").textContent = stand.titel || "";
        }
        zetLagen();
      });

      // ── Rapportvenster ────────────────────────────────────────────────────────────────────────
      // Geluid als een analoog rekentoestel: telwerk, relais, stappenschakelaar, magneet met bel.
      // Alles is ruis door filters met een doffe klap eronder. Een browser laat geluid pas toe na een
      // klik of toets; lukt het starten niet, dan blijft het scherm stil en werkt de rest gewoon.
      let audio = null, ruis = null, laatsteTik = 0;
      function geluidAan() {
        if (audio) { if (audio.state === "suspended") audio.resume().catch(() => {}); return; }
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        try {
          audio = new Ctx();
          ruis = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
          const data = ruis.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          audio.resume().catch(() => {});
        } catch (_err) { audio = null; }
      }
      geluidAan();
      ["pointerdown", "keydown"].forEach((naam) => window.addEventListener(naam, geluidAan));
      function klik({ hoogte = 3000, scherpte = 2, duur = 0.008, sterkte = 0.3, dof = 0, wanneer = 0 }) {
        if (!audio || audio.state !== "running") return;
        const nu = audio.currentTime + wanneer;
        const bronGeluid = audio.createBufferSource();
        bronGeluid.buffer = ruis;
        const filter = audio.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = hoogte * (0.9 + Math.random() * 0.2);
        filter.Q.value = scherpte;
        const gain = audio.createGain();
        gain.gain.setValueAtTime(sterkte, nu);
        gain.gain.exponentialRampToValueAtTime(0.0001, nu + duur);
        bronGeluid.connect(filter).connect(gain).connect(audio.destination);
        bronGeluid.start(nu, Math.random() * 0.5, duur + 0.02);
        if (dof) {
          const osc = audio.createOscillator();
          const laag = audio.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(dof * 1.6, nu);
          osc.frequency.exponentialRampToValueAtTime(dof, nu + 0.03);
          laag.gain.setValueAtTime(sterkte * 0.9, nu);
          laag.gain.exponentialRampToValueAtTime(0.0001, nu + 0.07);
          osc.connect(laag).connect(audio.destination);
          osc.start(nu);
          osc.stop(nu + 0.09);
        }
      }
      const geluid = {
        tel() {
          const nu = performance.now();
          if (nu - laatsteTik < 38) return;
          laatsteTik = nu;
          klik({ hoogte: 3800, scherpte: 3, duur: 0.006, sterkte: 0.22 });
        },
        relais() {
          klik({ hoogte: 2400, scherpte: 2, duur: 0.007, sterkte: 0.4 });
          klik({ hoogte: 750, scherpte: 4, duur: 0.03, sterkte: 0.45, dof: 120, wanneer: 0.024 });
        },
        stap() {
          klik({ hoogte: 1500, scherpte: 5, duur: 0.02, sterkte: 0.5, dof: 160 });
          klik({ hoogte: 4200, scherpte: 2, duur: 0.004, sterkte: 0.18, wanneer: 0.03 });
        },
        schakel() {
          for (let i = 0; i < 5; i++) klik({ hoogte: 1300 - i * 90, scherpte: 5, duur: 0.018, sterkte: 0.38, dof: 150, wanneer: i * 0.05 });
        },
        slot() {
          klik({ hoogte: 320, scherpte: 1.2, duur: 0.09, sterkte: 0.8, dof: 68 });
          if (!audio || audio.state !== "running") return;
          const nu = audio.currentTime + 0.05;
          [2093, 3322, 5210].forEach((hoogte, index) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = "sine";
            osc.frequency.value = hoogte;
            gain.gain.setValueAtTime(0.07 / (index + 1), nu);
            gain.gain.exponentialRampToValueAtTime(0.0001, nu + 1.1 - index * 0.25);
            osc.connect(gain).connect(audio.destination);
            osc.start(nu);
            osc.stop(nu + 1.2);
          });
        },
      };

      const RP_STAPPEN = ["Reacties tellen", "Berekening", "Conclusie"];
      const rpNl = (n, cijfers = 1) => Math.abs(n).toLocaleString("nl-NL", { minimumFractionDigits: cijfers, maximumFractionDigits: cijfers });
      const rpTeken = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + rpNl(n);
      let rpTimers = [], rpRonde = 0;
      function rpMaak(tag, klasse, tekst) {
        const node = document.createElement(tag);
        if (klasse) node.className = klasse;
        if (tekst != null) node.textContent = tekst;
        return node;
      }
      function rpRij(links, rechts, klasse) {
        const node = rpMaak("div", "rp-rij" + (klasse ? " " + klasse : ""));
        node.append(rpMaak("span", "", links), rpMaak("b", "", rechts));
        return node;
      }
      function rpTelOp(node, doel, ms, vorm) {
        const begin = performance.now();
        const mijn = rpRonde;
        let vorige = "";
        const stapje = (nu) => {
          if (mijn !== rpRonde) return;
          const deel = Math.min(1, (nu - begin) / ms);
          const tekst = vorm(doel * (1 - Math.pow(1 - deel, 3)));
          if (tekst !== vorige) { node.textContent = tekst; vorige = tekst; geluid.tel(); }
          if (deel < 1) requestAnimationFrame(stapje);
        };
        requestAnimationFrame(stapje);
      }
      function rpStap(nr) {
        el("rpStap").textContent = RP_STAPPEN[nr];
        el("rpStapNr").textContent = `0${nr + 1} / 0${RP_STAPPEN.length}`;
        el("rpBaan").style.width = `${((nr + 1) / RP_STAPPEN.length) * 100}%`;
        RP_STAPPEN.forEach((_naam, index) => el("rp" + index).classList.toggle("weg", index !== nr));
        geluid.schakel();
      }
      function rapportWeg() {
        rpTimers.forEach(clearTimeout);
        rpTimers = [];
        rpRonde++;
        rapportFase = 0;
        el("rapport").hidden = true;
        zetLagen();
      }
      // Speelt het rapport af. De eerste keer rustig; elke volgende scène iets sneller.
      function speelRapport(data, klaar) {
        rapportWeg();
        rapportFase = 1;
        zetLagen();
        const venster = el("rapport");
        const scene = data.scene, som = data.som;
        const tempo = Math.max(0.45, 1 - 0.14 * (Math.max(1, scene.nr) - 1));
        const straks = (ms, fn) => rpTimers.push(setTimeout(fn, ms * tempo));
        venster.classList.remove("klein");
        venster.hidden = false;
        el("rpScene").textContent = `Scène ${String(scene.nr).padStart(2, "0")}`;
        el("rpTitel").textContent = scene.titel;
        el("rpMeta").textContent = `${scene.seconden} seconden · ${scene.kijkers} kijkers`;
        ["rpReacties", "rpSom", "rpLabels", "rpTop"].forEach((id) => el(id).replaceChildren());
        el("rpHiernaKop").style.visibility = "hidden";
        const score = el("rpScore");
        score.classList.remove("aan");
        score.textContent = "";
        rpStap(0);
        let t = 400;

        // 1. Reacties tellen, en het zaalgeluid als golfvorm zodra dat gemeten wordt.
        const meeste = Math.max(scene.hartjes, scene.verveeld, scene.berichten, 1);
        [["hartjes", scene.hartjes], ["verveeld", scene.verveeld], ["berichten", scene.berichten]].forEach(([naam, waarde]) => {
          const rij = rpRij(naam, "0");
          const meter = rpMaak("div", "rp-meter");
          const vulling = rpMaak("i");
          meter.append(vulling);
          rij.append(meter);
          el("rpReacties").append(rij);
          straks(t, () => {
            rij.classList.add("aan");
            rpTelOp(rij.querySelector("b"), waarde, 450 * tempo, (n) => String(Math.round(n)));
            requestAnimationFrame(() => { vulling.style.width = `${(waarde / meeste) * 100}%`; });
          });
          t += 520;
        });
        if (scene.geluid) {
          const NS = "http://www.w3.org/2000/svg";
          const rij = rpRij(`zaalgeluid, piek (rust ${Math.round(scene.geluid.rustDb)} dB)`, "0 dB");
          const golf = document.createElementNS(NS, "svg");
          golf.setAttribute("class", "rp-golf");
          golf.setAttribute("viewBox", `0 0 ${scene.geluid.golf.length * 4} 60`);
          golf.setAttribute("preserveAspectRatio", "none");
          rij.append(golf);
          el("rpReacties").append(rij);
          straks(t, () => {
            rij.classList.add("aan");
            rpTelOp(rij.querySelector("b"), scene.geluid.piekDb, 1000 * tempo, (n) => `${Math.round(n)} dB`);
          });
          scene.geluid.golf.forEach((db, index) => {
            straks(t + index * (1000 / scene.geluid.golf.length), () => {
              const hoogte = Math.max(1, Math.min(1, Math.max(0.04, (db - 50) / 35)) * 56);
              const staaf = document.createElementNS(NS, "rect");
              staaf.setAttribute("x", index * 4);
              staaf.setAttribute("y", 30 - hoogte / 2);
              staaf.setAttribute("width", 2);
              staaf.setAttribute("height", hoogte);
              golf.append(staaf);
            });
          });
          t += 1000;
        }
        t += 1300;

        // 2. Berekening: de som, regel voor regel, tot de score.
        straks(t, () => rpStap(1));
        const maal = (n) => (n < 0 ? "−" : "") + rpNl(n, Number.isInteger(n) ? 0 : 2);
        const regels = [
          [`${scene.hartjes} hartjes × ${maal(som.wHart)}`, rpTeken(scene.hartjes * som.wHart), "som"],
          [`${scene.verveeld} verveeld × ${maal(som.wVerveeld)}`, rpTeken(scene.verveeld * som.wVerveeld), "som"],
          [`${scene.berichten} berichten × ${maal(som.wBericht)}`, rpTeken(scene.berichten * som.wBericht), "som"],
        ];
        if (scene.geluid && som.wGeluid) regels.push([`zaalgeluid ${rpNl(scene.geluid.liftDb)} dB boven rust × ${maal(som.wGeluid)}`, rpTeken(som.geluid), "som"]);
        regels.push(
          ["som", rpTeken(som.ruw), "som streep"],
          [`× duur (${scene.seconden} s)`, rpNl(som.duur, 2), "som"],
          [`× publiek (${scene.kijkers} kijkers)`, rpNl(som.publiek, 2), "som"],
        );
        regels.forEach(([links, rechts, klasse], index) => {
          const rij = rpRij(links, rechts, klasse);
          el("rpSom").append(rij);
          straks(t + 300 + index * 280, () => { rij.classList.add("aan"); geluid.relais(); });
        });
        t += 300 + regels.length * 280 + 100;
        straks(t, () => { score.classList.add("aan"); rpTelOp(score, scene.score, 800 * tempo, rpTeken); });
        straks(t + 850, () => geluid.slot());
        t += 2400;

        // 3. Conclusie: de stand per label, en de scène die hierna komt (niet tijdens het stemmen).
        straks(t, () => rpStap(2));
        const bereik = Math.max(...data.labels.map((label) => Math.abs(label.score)), 0.01);
        data.labels.forEach((label, index) => {
          const staaf = rpMaak("div", "rp-staaf" + (label.nu ? " nu" : ""));
          const spoor = rpMaak("div", "rp-spoor");
          const vulling = rpMaak("i");
          spoor.append(vulling);
          staaf.append(rpMaak("span", "", label.naam), spoor, rpMaak("b", "", rpTeken(label.score)));
          el("rpLabels").append(staaf);
          straks(t + 300 + index * 220, () => {
            staaf.classList.add("aan");
            geluid.relais();
            requestAnimationFrame(() => { vulling.style.width = `${(Math.abs(label.score) / bereik) * 100}%`; });
          });
        });
        t += 300 + data.labels.length * 220 + 500;
        if (data.hierna) {
          const rij = rpRij(data.hierna.titel, data.hierna.score == null ? "" : rpTeken(data.hierna.score), "top streep");
          el("rpTop").append(rij);
          straks(t, () => { el("rpHiernaKop").style.visibility = "visible"; rij.classList.add("aan"); geluid.relais(); });
        }
        t += 2200;
        // Het venster klapt dicht tot zijn titelbalk; het universum gaat verder met kiezen.
        straks(t, () => {
          venster.classList.add("klein");
          el("rpScene").textContent = `Scène ${String(scene.nr).padStart(2, "0")} · ${rpTeken(scene.score)}`;
          geluid.schakel();
          klaar();
        });
      }
      // Scène afgelopen: het rapport ophalen. Het algoritme heeft even nodig om de scène te verwerken;
      // komt het rapport niet op tijd, dan staan de tellingen in beeld zoals voorheen.
      let rapportVraag = 0;
      async function toonRapport() {
        const vraag = ++rapportVraag;
        // Het genereren van de vorige scène verdwijnt meteen; het rapport volgt zodra het er is.
        rapportFase = 1;
        zetLagen();
        const situationRunId = ronde && ronde.situationRunId ? ronde.situationRunId : "";
        let data = null;
        for (let poging = 0; poging < 8 && vraag === rapportVraag; poging++) {
          try {
            const antwoord = await fetch(`/audience/stage/rapport?situationRunId=${encodeURIComponent(situationRunId)}&ts=${Date.now()}`, { cache: "no-store" }).then((res) => res.json());
            if (antwoord && antwoord.klaar) { data = antwoord; break; }
          } catch (_err) {}
          await new Promise((resolve) => setTimeout(resolve, 600));
        }
        if (vraag !== rapportVraag) return;
        if (data) { speelRapport(data, universumVerder); return; }
        rapportFase = 0;
        statsAan = true;
        zetLagen();
        clearTimeout(statsWeg);
        statsWeg = setTimeout(() => { statsAan = false; zetLagen(); universumVerder(); }, NA_SCENE_MS);
      }

      // QR-code om mee te doen: altijd klein in de hoek.
      async function tekenQr() {
        const data = await fetch("/audience/admin/state?stage=qr&ts=" + Date.now(), { cache: "no-store" }).then((res) => res.json());
        const url = data.sessionJoin && data.sessionJoin.joinUrl;
        const box = el("qr");
        if (!url || typeof qrcode !== "function") { box.hidden = true; return; }
        if (box.dataset.url === url) return;
        const qr = qrcode(0, "M");
        qr.addData(url);
        qr.make();
        box.innerHTML = qr.createImgTag(8, 0);
        box.dataset.url = url;
        box.hidden = false;
      }
      tekenQr().catch(() => {});
      setInterval(() => tekenQr().catch(() => {}), 5000);

      // De fase komt van TouchDesigner: 0 inloop, 1 loading, 2 scène. Bij de scène schuift het scherm
      // omhoog weg en blijven alleen de emoji en de ondertitel over het camerabeeld staan; daarna komt
      // het van onderen terug. De laatste fase wordt onthouden, zodat een herladen pagina goed begint.
      let inScene = false, eenGeladen = false, faseSinds = 0;
      function eenLagen() {
        if (eenGeladen) return;
        eenGeladen = true;
        el("emoji").src = "/audience/stage/emoji";
        el("ondertitel").src = `${location.protocol}//${location.hostname}:3027/script-agent/teleprompter-parser/live-captions`;
      }
      window.forYouFase = (fase, direct) => {
        const scene = Number(fase) === 2;
        document.documentElement.classList.add("een");
        document.body.classList.add("een");
        eenLagen();
        faseSinds = Date.now();
        try { localStorage.setItem("for_you_fase", JSON.stringify({ fase: scene ? 2 : 1, at: faseSinds })); } catch (_err) {}
        if (scene === inScene) return;
        inScene = scene;
        const laag = el("tussenlaag");
        if (direct) laag.style.transition = "none";
        if (scene) {
          document.body.classList.add("scene");
        } else {
          // Terug uit de scène: van onderen het beeld in.
          if (!direct) {
            laag.style.transition = "none";
            laag.style.transform = "translateY(100%)";
            void laag.offsetHeight;
            laag.style.transition = "";
          }
          document.body.classList.remove("scene");
          laag.style.transform = "";
        }
        if (direct) { void laag.offsetHeight; laag.style.transition = ""; }
      };
      try {
        const bewaard = JSON.parse(localStorage.getItem("for_you_fase") || "null");
        if (bewaard && Date.now() - bewaard.at < 10000) window.forYouFase(bewaard.fase, true);
      } catch (_err) {}
      // Vangnet: geeft TouchDesigner de fase niet meer door, dan wordt de pagina weer gewoon het
      // dekkende scherm van inloop en loading.
      setInterval(() => {
        if (!faseSinds || Date.now() - faseSinds < 10000) return;
        faseSinds = 0;
        inScene = false;
        const laag = el("tussenlaag");
        laag.style.transition = "none";
        document.documentElement.classList.remove("een");
        document.body.classList.remove("een", "scene");
        void laag.offsetHeight;
        laag.style.transition = "";
      }, 2000);

      function pas() {
        const s = Math.min(window.innerWidth / W, window.innerHeight / H);
        const tx = (window.innerWidth - W * s) / 2, ty = (window.innerHeight - H * s) / 2;
        stage.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      }
      window.addEventListener("resize", pas);
      pas();

      const getal = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);

      function toepassen(next) {
        settings = next || settings || {};
        plaatsScript();
        el("statsRij").style.fontSize = Math.max(72, getal(settings.tussenStatsGrootte, 88)) + "px";
        const c = el("chat");
        c.style.top = getal(settings.tussenChatY, 1380) + "px";
        c.style.height = getal(settings.tussenChatHoogte, 480) + "px";
        c.style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        el("top").style.fontSize = getal(settings.tussenChatGrootte, 40) + "px";
        tekenChat();
      }

      // De operator-chat: de pagina van de script-agent (poort 3027). De onderkant, met de nieuwste tekst,
      // staat in beeld; het vlak begint onder de titel.
      el("scriptFrame").src = `${location.protocol}//${location.hostname}:3027/script-agent/operator/stage?doorzichtig=1`;
      function plaatsScript() {
        const top = Math.max(300, getal(settings.tussenScriptY, 230));
        const hoogte = Math.max(200, getal(settings.tussenScriptY, 230) + getal(settings.tussenScriptHoogte, 860) - top + 250);
        el("script").style.top = top + "px";
        el("script").style.height = hoogte + "px";
        el("scriptFrame").style.top = (hoogte - H) + "px";
      }

      // Beeld van de omgeving: foto of video uit de catalogus (poort 3021).
      let beeldNu = "";
      function zetBeeld(omgeving) {
        const adres = omgeving && omgeving.beeld ? `${location.protocol}//${location.hostname}:3021${omgeving.beeld}` : "";
        const box = el("beeld");
        box.dataset.uitsnede = (omgeving && omgeving.uitsnede) || "hoog";
        if (adres === beeldNu) return;
        beeldNu = adres;
        box.textContent = "";
        box.hidden = !adres;
        if (!adres) return;
        const media = document.createElement(omgeving.soort === "video" ? "video" : "img");
        if (omgeving.soort === "video") { media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true; }
        media.addEventListener("error", () => { box.hidden = true; });
        media.src = adres;
        box.appendChild(media);
      }

      function tekenStats() {
        const box = el("stats");
        if (!ronde || !ronde.start) { box.hidden = true; plaatsChat(); return; }
        box.hidden = false;
        el("statsScene").textContent = ronde.titel || "";
        const rij = el("statsRij");
        rij.textContent = "";
        const emoji = ronde.emoji || {};
        const lijst = reacties.length ? reacties.map((r) => r.emoji) : Object.keys(emoji);
        for (const e of lijst) {
          const span = document.createElement("span");
          span.className = "telling";
          const em = document.createElement("span");
          em.className = "emoji";
          em.textContent = e;
          const n = document.createElement("span");
          n.textContent = String(Number(emoji[e] || 0));
          span.append(em, n);
          rij.appendChild(span);
        }
        plaatsChat();
      }

      // Reacties van deze ronde; de comment met de meeste likes staat bovenaan (boven de reacties).
      let berichten = [];
      // Elke regel wordt één keer gemaakt en daarna hergebruikt; alleen nieuwe regels schuiven in beeld.
      // (Alles opnieuw opbouwen liet de hele chat bij elk bericht of elke emoji knipperen.)
      const regelEls = new WeakMap();
      function vulRegel(r, msg) {
        r.textContent = "";
        const naam = document.createElement("span");
        naam.className = "naam";
        naam.textContent = (msg.name || "Anoniem") + " ";
        if (/^#[0-9a-f]{6}$/i.test(String(msg.nameColor || ""))) naam.style.color = msg.nameColor;
        r.append(naam, document.createTextNode(msg.text));
        if (msg.likes > 0) {
          const h = document.createElement("span");
          h.className = "likes";
          h.textContent = " \u2665 " + msg.likes;
          r.appendChild(h);
        }
        r.dataset.likes = String(msg.likes || 0);
      }
      function regelEl(msg) {
        let r = regelEls.get(msg);
        if (!r) {
          r = document.createElement("div");
          r.className = "regel nieuw";
          r.addEventListener("animationend", () => r.classList.remove("nieuw"), { once: true });
          vulRegel(r, msg);
          regelEls.set(msg, r);
        } else if (r.dataset.likes !== String(msg.likes || 0)) {
          vulRegel(r, msg);
        }
        return r;
      }
      // Zet de juiste elementen op hun plek zonder bestaande regels weg te halen.
      function zetKinderen(ouder, lijst) {
        for (const kind of [...ouder.children]) if (!lijst.includes(kind)) kind.remove();
        lijst.forEach((kind, i) => {
          if (ouder.children[i] !== kind) ouder.insertBefore(kind, ouder.children[i] || null);
        });
      }
      function tekenChat() {
        const top = berichten.reduce((best, m) => (m.likes > 0 && (!best || m.likes > best.likes || (m.likes === best.likes && m.id < best.id)) ? m : best), null);
        const t = el("top");
        t.hidden = !top;
        zetKinderen(t, top ? [regelEl(top)] : []);
        const c = el("chat");
        zetKinderen(c, berichten.slice(-MAX_REGELS).filter((m) => m !== top).map(regelEl));
        plaatsChat();
      }
      function plaatsChat() {
        const chatTop = getal(settings.tussenChatY, 1380);
        const chatHoogte = getal(settings.tussenChatHoogte, 480);
        const t = el("top");
        t.style.top = chatTop + "px";
        const topHoogte = t.hidden ? 0 : t.offsetHeight + 24;
        const c = el("chat");
        c.style.top = (chatTop + topHoogte) + "px";
        c.style.height = Math.max(0, chatHoogte - topHoogte) + "px";
      }
      function regel(msg) {
        if (!msg || msg.system || !msg.text) return;
        if (ronde && ronde.start && msg.time && Date.parse(msg.time) < Date.parse(ronde.start)) return;
        if (msg.id && berichten.some((m) => m.id === msg.id)) return;
        berichten.push({ id: Number(msg.id) || 0, name: msg.name, nameColor: msg.nameColor, text: msg.text, likes: Number(msg.likes) || 0, time: msg.time });
        if (berichten.length > 200) berichten = berichten.slice(-200);
        tekenChat();
      }

      function nieuweRonde(next) {
        const was = ronde && ronde.start;
        ronde = next || ronde;
        if (ronde.start && ronde.start !== was) { berichten = []; tekenChat(); }
        tekenStats();
      }

      // De stemming op de startscène is op dit scherm alleen in het universum te zien (koploper en winnaar lichten op).

      const bron = new EventSource("/audience/stage/stroom");
      bron.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "stage_herlaad") { location.reload(); return; }
        if (msg.type === "begin") {
          toepassen(msg.settings);
          reacties = msg.reacties || [];
          ronde = msg.ronde || ronde;
          berichten = [];
          for (const m of msg.berichten || []) regel(m);
          tekenChat();
          tekenStats();
        } else if (msg.type === "stage_settings") toepassen(msg.stage && msg.stage.settings);
        else if (msg.type === "reacties") { reacties = msg.reacties || []; tekenStats(); }
        else if (msg.type === "fase") nieuweRonde(msg.ronde);
        else if (msg.type === "reaction_update" && msg.ronde) { ronde.emoji = msg.ronde; tekenStats(); }
        else if (msg.type === "comment") regel(msg);
        else if (msg.type === "comment_likes") {
          const m = berichten.find((b) => b.id === Number(msg.id));
          if (m) { m.likes = Number(msg.likes) || 0; tekenChat(); }
        }
        else if (msg.type === "session_reset" || msg.type === "session_closed" || msg.type === "chat_reset") {
          berichten = [];
          tekenChat();
          ronde.emoji = {};
          tekenStats();
        }
      };
    </script>
  </body>
</html>
