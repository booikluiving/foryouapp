<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For You - Audience QR V2</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box {
        background: rgba(255,255,255,0.94);
        border-radius: 24px;
        padding: 24px;
        display: grid;
        gap: 12px;
        place-items: center;
        color: #16202b;
      }
      .box img { width: min(56vw, 420px); height: min(56vw, 420px); }
      .muted { color: #5f6b7a; }
    </style>
  </head>
  <body>
    <div class="box">
      <div id="qr"></div>
      <div id="label" class="muted">Scan om mee te doen</div>
    </div>
    <script src="/v2/audience/vendor/qrcode-generator.min.js"></script>
    <script>
      async function refresh() {
        const data = await fetch("/v2/audience/admin/state?stage=qr&ts=" + Date.now(), { cache: "no-store" }).then((res) => res.json());
        const url = data.sessionJoin && data.sessionJoin.joinUrl;
        const qrEl = document.getElementById("qr");
        if (!url || typeof qrcode !== "function") {
          qrEl.innerHTML = '<span class="muted">Geen QR-code</span>';
          return;
        }
        const qr = qrcode(0, "M");
        qr.addData(url);
        qr.make();
        qrEl.innerHTML = qr.createImgTag(8, 0);
      }
      refresh().catch(() => {});
      setInterval(() => refresh().catch(() => {}), 1200);
    </script>
  </body>
</html>
