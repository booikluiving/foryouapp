<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operator Stage</title>
    <link rel="stylesheet" href="/script-agent/operator/assets/styles.css">
  </head>
  <body class="terminal-stage-body">
    <div id="stageWrap">
      <div id="stage" data-cursor="block">
        <main class="terminal-stage" id="terminal">
          <div class="stage-hint">
            <span>ENTER SEND</span>
            <span>ESC CLEAR</span>
          </div>
          <section class="stage-log" id="log" aria-live="polite">
            <div id="logInner"></div>
          </section>
          <section class="prompt-row">
            <div class="prompt-inner">
              <span class="sigil">&gt;</span>
              <span id="typing"><span class="cursor"></span></span>
            </div>
          </section>
        </main>
        <div id="stageStatus" aria-live="polite">
          <span id="connectionStatus">connecting</span>
          <span id="usageStatus">0 tokens - $0.0000</span>
        </div>
        <textarea id="hiddenInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
    </div>

    <script src="/script-agent/operator/assets/stage.js" defer></script>
  </body>
</html>
