<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Script Agent Operator</title>
    <link rel="stylesheet" href="/script-agent/operator/assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Script Agent</p>
        <h1>Operator</h1>
      </div>
      <nav class="toplinks" aria-label="Snelle links">
        <a href="/script-agent/operator/stage" target="_blank" rel="noreferrer">Stage</a>
        <a href="http://127.0.0.1:3024/runtime" target="_blank" rel="noreferrer">Runtime</a>
        <a href="http://127.0.0.1:3026/audience/admin" target="_blank" rel="noreferrer">Audience</a>
        <a href="http://127.0.0.1:3023/health" target="_blank" rel="noreferrer">Algorithm</a>
      </nav>
    </header>

    <main class="layout">
      <section class="panel status-panel">
        <div>
          <p class="eyebrow">Provider</p>
          <h2>DeepSeek</h2>
        </div>
        <dl class="status-grid">
          <div>
            <dt>Model</dt>
            <dd id="statusModel">-</dd>
          </div>
          <div>
            <dt>API key</dt>
            <dd id="secretStatus">-</dd>
          </div>
          <div>
            <dt>Draft</dt>
            <dd id="draftStatus">-</dd>
          </div>
          <div>
            <dt>Laatste output</dt>
            <dd id="outputStatus">-</dd>
          </div>
        </dl>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Prepared next</p>
            <h2>Prompt draft</h2>
          </div>
          <div class="button-row">
            <button id="refreshDraft" type="button">Refresh</button>
            <button id="saveDraft" type="button">Bewaar draft</button>
            <button id="sendDraft" class="primary" type="button">Send naar chat</button>
          </div>
        </div>
        <textarea id="draftText" class="draft-area" spellcheck="false"></textarea>
        <p id="draftMeta" class="meta-line">Geen draft geladen.</p>
      </section>

      <section class="split">
        <form id="settingsForm" class="panel">
          <div class="section-head compact">
            <h2>Prompt instellingen</h2>
            <button type="submit">Opslaan</button>
          </div>
          <label>
            Model
            <input id="model" name="model" autocomplete="off" value="deepseek-chat">
          </label>
          <label>
            Max tokens
            <input id="maxTokens" name="maxTokens" type="number" min="256" max="16000" step="256">
          </label>
          <label>
            Temperature
            <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.05">
          </label>
          <label>
            System prompt
            <textarea id="systemPrompt" name="systemPrompt" class="small-area" spellcheck="false"></textarea>
          </label>
          <label>
            Prompt template
            <textarea id="promptTemplate" name="promptTemplate" class="small-area template-area" spellcheck="false"></textarea>
          </label>
        </form>

        <section class="panel">
          <div class="section-head compact">
            <h2>Secrets</h2>
          </div>
          <form id="secretForm" class="secret-form">
            <label>
              DeepSeek API key
              <input id="deepSeekApiKey" name="deepSeekApiKey" type="password" autocomplete="new-password" placeholder="sk-...">
            </label>
            <div class="button-row">
              <button type="submit">Bewaar key</button>
              <button id="clearSecret" class="danger" type="button">Verwijder key</button>
            </div>
          </form>
        </section>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Chat</p>
            <h2>Operator sessie</h2>
          </div>
          <div class="button-row">
            <button id="undoTurn" type="button">Undo</button>
            <button id="clearSession" class="danger" type="button">Reset sessie</button>
          </div>
        </div>
        <div id="chatLog" class="chat-log" aria-live="polite"></div>
        <p id="chatMeta" class="meta-line">Klaar.</p>
      </section>
    </main>

    <script src="/script-agent/operator/assets/app.js" defer></script>
  </body>
</html>
