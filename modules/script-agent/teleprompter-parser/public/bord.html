<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For_You - Bord</title>
    <style>
      /* Bord 1 t/m 5 over het camerabeeld. Maten in het raster van het zaalscherm (1080 × 1920).
         Plek van het bord en van het rouleervak: ?bx=&by=&rx=&ry= */
      html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
      body.proef { background: #2b3038; }
      #vel { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; visibility: hidden; }
      #vel.aan { visibility: visible; }
      #bord { position: absolute; left: var(--bx, 800px); top: var(--by, 60px); width: 220px; display: grid; gap: 16px; }
      .plek { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 12px; }
      .plek b { font-size: 60px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 0 4px #000, 0 2px 10px rgba(0, 0, 0, 0.9); }
      .vak { height: 164px; border: 4px solid #fff; background: rgba(7, 8, 11, 0.6); position: relative; overflow: hidden; }
      .kaart { position: absolute; inset: 0; background: #12141a; display: grid; place-items: center; }
      .kaart img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
      .kaart span { font-size: 26px; font-weight: 700; text-align: center; padding: 0 8px; overflow-wrap: anywhere; }
      .kaart small { position: absolute; left: 0; right: 0; bottom: 0; font-size: 20px; background: rgba(7, 8, 11, 0.8); padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #nieuw { position: absolute; left: var(--rx, 151px); top: var(--ry, 864px); width: 626px; height: 626px; border: 4px solid #fff; overflow: hidden; box-sizing: border-box; transition: left 420ms cubic-bezier(.65, 0, .35, 1), top 420ms cubic-bezier(.65, 0, .35, 1), width 420ms cubic-bezier(.65, 0, .35, 1), height 420ms cubic-bezier(.65, 0, .35, 1); }
      #nieuw .kaart span { font-size: 84px; }
      #nieuw .kaart small { font-size: 46px; padding: 12px 22px; }
      #nieuw.weg { visibility: hidden; }
      #nieuw.vast { transition: none; }
    </style>
  </head>
  <body>
    <div id="vel">
      <div id="bord"></div>
      <div id="nieuw" class="weg"></div>
    </div>
    <script src="/script-agent/teleprompter-parser/bord-app.js?v=6"></script>
  </body>
</html>
