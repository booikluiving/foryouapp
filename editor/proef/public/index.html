<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>For_You proefshow</title>
    <style>
      :root { --rand: #2a2d35; --grijs: #8b909c; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #0b0c10; color: #fff; font: 14px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { flex: none; display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--rand); }
      header b { font-size: 15px; }
      header a { color: var(--grijs); text-decoration: none; }
      #stand { color: var(--grijs); margin-left: auto; }
      main { flex: 1; min-height: 0; display: flex; gap: 24px; padding: 16px; justify-content: center; overflow-x: auto; }
      .vak { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
      .vak > span { flex: none; color: var(--grijs); }
      /* Het zaalscherm staat rechtop (1080 × 1920). Tijdens de scène is de pagina doorzichtig: in de zaal
         staat het camerabeeld erachter, hier een grijs vlak. */
      #zaal { flex: none; height: calc(100vh - 120px); aspect-ratio: 9 / 16; background: #3a3d45 center / 60% no-repeat; position: relative; border: 1px solid var(--rand); }
      #zaal::before { content: "camerabeeld"; position: absolute; inset: 0; display: grid; place-items: center; color: #6b7080; }
      #telefoon { flex: none; height: min(844px, calc(100vh - 120px)); aspect-ratio: 390 / 844; border: 1px solid var(--rand); border-radius: 28px; overflow: hidden; background: #000; position: relative; }
      /* De publiekspagina draait op de maat van een telefoon (390 × 844) en wordt verkleind getoond. */
      #telefoonFrame { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
      /* De teleprompter van één speler (liggend), met eronder de keuze voor speler 1, 2 of 3. */
      #prompter { flex: none; width: min(560px, 34vw); aspect-ratio: 16 / 9; border: 1px solid var(--rand); background: #000; overflow: hidden; }
      /* De pagina is gemaakt voor een groot scherm: ze draait op 1280 × 720 en wordt verkleind getoond. */
      #prompterFrame { width: 1280px; height: 720px; transform-origin: 0 0; }
      #prompterKeuze { display: flex; gap: 8px; }
      #prompterKeuze button { flex: 1; padding: 8px 10px; }
      iframe { position: relative; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
      #knoppen { flex: none; width: 150px; display: flex; flex-direction: column; gap: 8px; }
      button { font: inherit; font-weight: 700; letter-spacing: .02em; padding: 14px 10px; background: #15171d; color: #fff; border: 1px solid var(--rand); border-radius: 6px; cursor: pointer; }
      button:hover { border-color: #fff; }
      button.aan { background: #fff; color: #000; }
      button.bezig { opacity: .5; }
      button.fout { border-color: #e5484d; }
      button.klein { font-weight: 400; padding: 8px 10px; color: var(--grijs); }
      hr { width: 100%; border: 0; border-top: 1px solid var(--rand); margin: 4px 0; }
      /* Op een telefoon: zaalscherm en telefoon naast elkaar, de knoppen eronder, de teleprompter onderaan. */
      @media (max-width: 820px) {
        html, body { height: auto; }
        header { flex-wrap: wrap; gap: 8px 16px; }
        #stand { margin-left: 0; width: 100%; }
        main { flex-wrap: wrap; gap: 10px; padding: 10px; overflow-x: visible; justify-content: flex-start; }
        main > .vak:nth-child(1) { width: calc(57% - 5px); }
        main > .vak:nth-child(2) { width: calc(43% - 5px); }
        main > .vak:nth-child(3) { order: 4; width: 100%; }
        #zaal { height: auto; width: 100%; }
        #telefoon { height: auto; width: 100%; border-radius: 16px; }
        #prompter { width: 100%; }
        #knoppen { order: 3; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
        #knoppen hr { display: none; }
        #knoppen button { padding: 12px 6px; font-size: 13px; }
        #knoppen button.klein { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <b>For_You proefshow</b>
      <a href="/catalog/">Voorstelling</a>
      <span id="stand"></span>
    </header>
    <main>
      <div class="vak">
        <span>Zaalscherm</span>
        <div id="zaal"><iframe id="zaalFrame" title="Zaalscherm" allow="autoplay"></iframe></div>
      </div>
      <div class="vak">
        <span>Telefoon</span>
        <div id="telefoon"><iframe id="telefoonFrame" title="Telefoon"></iframe></div>
      </div>
      <div class="vak">
        <span>Teleprompter</span>
        <div id="prompter"><iframe id="prompterFrame" title="Teleprompter"></iframe></div>
        <div id="prompterKeuze">
          <button data-prompter="1" class="aan">1</button>
          <button data-prompter="2">2</button>
          <button data-prompter="3">3</button>
        </div>
      </div>
      <div id="knoppen">
        <button data-knop="run">RUN</button>
        <button data-knop="stem">STEM</button>
        <button data-knop="chat">CHAT</button>
        <button data-knop="ready" title="Tijdens het stemmen: het stemmen sluiten. Anders: de teleprompter op ready.">READY</button>
        <button data-knop="scene">START</button>
        <hr>
        <button data-knop="startfase" title="Eerst drie startscènes waarop het publiek stemt. Uit: vanaf de eerste scène kiest het algoritme en wordt er tijdens het stemmen al geschreven.">STARTFASE</button>
        <button data-knop="bots">BOTS</button>
        <button data-knop="personages">PERSONAGES</button>
        <hr>
        <button class="klein" id="herlaadZaal">Zaalscherm herladen</button>
        <button class="klein" id="herlaadTelefoon">Telefoon herladen</button>
        <button class="klein" id="losZaal">Zaalscherm los openen</button>
      </div>
    </main>
    <script>
      const el = (id) => document.getElementById(id);
      const ZAAL = "/audience/stage/tussen?eenAdres=1&rapport=0&tempo=2.5&universum=/proefshow/universe&stand=/proefshow/universe-state";
      const knop = (naam) => document.querySelector(`[data-knop="${naam}"]`);
      let stand = null;
      let sessieWas = false;

      function laadZaal() { el("zaalFrame").src = `${ZAAL}&_=${Date.now()}`; }
      function laadTelefoon() { el("telefoonFrame").src = `/proefshow/telefoon?_=${Date.now()}`; }

      // In de zaal geeft TouchDesigner de fase door aan de pagina; hier doet de werkplaats dat.
      function geefFase() {
        if (!stand) return;
        try {
          const venster = el("zaalFrame").contentWindow;
          if (venster && venster.forYouFase) venster.forYouFase(stand.fase);
        } catch (_err) {}
      }

      async function ververs() {
        try {
          stand = await fetch("/proefshow/api/stand", { cache: "no-store" }).then((antwoord) => antwoord.json());
        } catch (_err) {
          el("stand").textContent = "geen verbinding";
          return;
        }
        knop("run").textContent = stand.run ? "RESET RUN" : "RUN";
        knop("scene").textContent = stand.scene ? "STOP" : "START";
        knop("stem").classList.toggle("aan", stand.stemmen);
        knop("scene").classList.toggle("aan", stand.scene);
        knop("chat").classList.toggle("aan", stand.schrijft);
        knop("ready").classList.toggle("aan", !!stand.stemronde);
        knop("ready").textContent = stand.stemronde ? "READY · STEMMEN DICHT" : "READY";
        knop("bots").classList.toggle("aan", stand.bots > 0);
        knop("startfase").classList.toggle("aan", !!stand.startfase);
        knop("startfase").textContent = stand.startfase ? (stand.startfaseLoopt ? "STARTFASE LOOPT" : "STARTFASE AAN") : "STARTFASE UIT";
        const uit = Object.entries(stand.onderdelen).filter(([, draait]) => !draait).map(([naam]) => naam);
        el("stand").textContent = uit.length ? `start: ${uit.join(", ")}` : ["inloop", "loading", stand.titel || "scène"][stand.fase];
        if (stand.sessie && !sessieWas) laadTelefoon();
        sessieWas = stand.sessie;
        geefFase();
      }

      document.querySelectorAll("[data-knop]").forEach((button) => button.addEventListener("click", async () => {
        button.classList.remove("fout");
        button.classList.add("bezig");
        try {
          const antwoord = await fetch("/proefshow/api/knop", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ knop: button.dataset.knop }) }).then((res) => res.json());
          if (!antwoord.ok) {
            button.classList.add("fout");
            button.title = JSON.stringify(antwoord.fout || antwoord).slice(0, 300);
          } else button.title = "";
        } catch (_err) {
          button.classList.add("fout");
        }
        button.classList.remove("bezig");
        ververs();
      }));
      // De teleprompter: dezelfde pagina als in de ring, per speler.
      function laadPrompter(speler) {
        el("prompterFrame").src = `/script-agent/teleprompter-parser/stage/${speler}?_=${Date.now()}`;
        document.querySelectorAll("[data-prompter]").forEach((button) => button.classList.toggle("aan", button.dataset.prompter === String(speler)));
      }
      document.querySelectorAll("[data-prompter]").forEach((button) => button.addEventListener("click", () => laadPrompter(button.dataset.prompter)));
      laadPrompter(1);
      function pasPrompter() {
        el("prompterFrame").style.transform = `scale(${el("prompter").clientWidth / 1280})`;
        el("telefoonFrame").style.transform = `scale(${el("telefoon").clientWidth / 390})`;
      }
      window.addEventListener("resize", pasPrompter);
      pasPrompter();
      el("herlaadZaal").addEventListener("click", laadZaal);
      el("herlaadTelefoon").addEventListener("click", laadTelefoon);
      el("losZaal").addEventListener("click", () => window.open(ZAAL, "_blank"));

      laadZaal();
      laadTelefoon();
      ververs();
      setInterval(ververs, 1000);
    </script>
  </body>
</html>
